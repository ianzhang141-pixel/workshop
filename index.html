<meta charset="utf-8">
<title>日常工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
:root{
  --desk:#EAE3D8; --panel:#FAF6F0; --panel-2:#F2ECE2; --panel-3:#E6DDCF;
  --ink:#3B352F; --ink-2:#6F655B; --ink-3:#A0958A;
  --line:#DFD5C6; --line-2:#C9BCA8;
  --brand:#7E9080; --brand-ink:#5E6F60; --brand-soft:#E0E6DC;
  --ok:#7E9080; --ok-soft:#E0E6DC;
  --warn:#BF9455; --warn-soft:#F5E9D5;
  --crit:#B47B72; --crit-soft:#F2E1DC;
  --on-accent:#FAF6F0;
  --shadow:0 1px 2px rgba(78,64,48,.06), 0 10px 26px -16px rgba(78,64,48,.30);
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-display:"Noto Serif SC","Songti SC","SimSun",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#211D19; --panel:#2A2521; --panel-2:#332D27; --panel-3:#3D362E;
    --ink:#EDE5D9; --ink-2:#B5AA9C; --ink-3:#8B8072;
    --line:#3C352D; --line-2:#50473C;
    --brand:#9DB39C; --brand-ink:#B8CAB6; --brand-soft:#2F382E;
    --ok:#9DB39C; --ok-soft:#2F382E;
    --warn:#D6AF74; --warn-soft:#3E321E;
    --crit:#CE988D; --crit-soft:#3C2A25;
    --on-accent:#211D19;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --desk:#211D19; --panel:#2A2521; --panel-2:#332D27; --panel-3:#3D362E;
  --ink:#EDE5D9; --ink-2:#B5AA9C; --ink-3:#8B8072;
  --line:#3C352D; --line-2:#50473C;
  --brand:#9DB39C; --brand-ink:#B8CAB6; --brand-soft:#2F382E;
  --ok:#9DB39C; --ok-soft:#2F382E;
  --warn:#D6AF74; --warn-soft:#3E321E;
  --crit:#CE988D; --crit-soft:#3C2A25;
  --on-accent:#211D19;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -16px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100%;
     background:linear-gradient(to right,var(--panel) 0 265px,var(--line) 265px 266px,var(--desk) 266px 100%)}
.rail{background:transparent;padding:22px 16px 28px;display:flex;flex-direction:column;gap:22px;
      position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100dvh;overflow:auto}
.stage{min-width:0;display:flex;flex-direction:column}
.content{padding:18px 20px 64px;display:flex;flex-direction:column;gap:18px;max-width:1080px;width:100%}
@media (min-width:1200px){ .content{padding-inline:32px} }

.brand{display:flex;align-items:baseline;gap:9px}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:20px;margin:0;letter-spacing:.02em}
.brand .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}

.rail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.rail-head h2{margin:0;font-size:10px;letter-spacing:.18em;color:var(--ink-3);font-family:var(--font-mono);font-weight:500;text-transform:uppercase}
.mini{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:2px 8px;font-size:11px;color:var(--ink-2);cursor:pointer;line-height:1.7}
.mini:hover{border-color:var(--line-2);color:var(--ink)}

.users{display:flex;flex-wrap:wrap;gap:7px}
.user{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel-2);
      border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-weight:500}
.user .dot{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.user[aria-pressed="true"]{background:var(--panel);border-color:transparent;font-weight:700;
      box-shadow:inset 0 0 0 2px var(--u-color,var(--brand)), var(--shadow)}

.boards{display:flex;flex-direction:column;gap:2px}
.board-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;
           padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-weight:500}
.board-btn .ic{width:22px;text-align:center;font-size:15px;flex:none}
.board-btn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-btn .ct{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.board-btn:hover{background:var(--panel-2);color:var(--ink)}
.board-btn[aria-current="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.board-btn[aria-current="true"] .ct{color:var(--brand-ink)}
.board-btn.overview{border-bottom:1px solid var(--line);border-radius:9px 9px 0 0;margin-bottom:4px;padding-bottom:10px}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rail-foot p{margin:0;font-size:11px;color:var(--ink-3);line-height:1.7}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--desk) 88%,transparent);
        backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
@media (min-width:1200px){ .topbar{padding-inline:32px} }
.datenav{display:flex;align-items:center;gap:4px}
.nav-btn{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.nav-btn:hover{border-color:var(--line-2);color:var(--ink)}
.today-btn{height:30px;padding:0 11px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.today-btn:hover{border-color:var(--line-2);color:var(--ink)}
.bigdate{display:flex;align-items:baseline;gap:9px;min-width:0}
.bigdate .d{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.01em}
.bigdate .w{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.bigdate .rel{font-size:11px;color:var(--warn);background:var(--warn-soft);padding:1px 8px;border-radius:999px}
.topbar .spacer{flex:1}
.ring{display:flex;align-items:center;gap:9px}
.ring svg{display:block}
.ring .txt{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.ring .txt b{color:var(--ink);font-size:14px}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.panel > header{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px solid var(--line)}
.panel > header h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em}
.panel > header .sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.panel > header .sp{flex:1}
.panel .body{padding:6px}
.panel .pad{padding:14px 16px}

.empty{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:13px}

/* reminder band */
.band{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;display:flex;flex-wrap:wrap;align-items:stretch}
.band.alert{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.band .flag{display:flex;align-items:center;gap:8px;padding:12px 15px;background:var(--panel-2);border-right:1px solid var(--line);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--ink-2)}
.band.alert .flag{background:var(--warn-soft);color:var(--warn);border-right-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.band .items{display:flex;flex-wrap:wrap;gap:7px;padding:10px 14px;flex:1;min-width:0;align-items:center}
.rchip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 11px;font-size:12.5px;background:var(--panel-2);border:1px solid var(--line)}
.rchip b{font-weight:700}
.rchip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.rchip.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.rchip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

/* stats: one object, divided */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{padding:13px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.13em;color:var(--ink-3);text-transform:uppercase}
.stat .v{font-family:var(--font-mono);font-size:24px;font-weight:600;line-height:1.25;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--ink-3);font-weight:400}
.stat .n{font-size:11px;color:var(--ink-3)}
.stat.hot .v{color:var(--crit)}
.stat.warm .v{color:var(--warn)}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2n){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:12px}
.day{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:8px 4px 9px;text-align:center;cursor:pointer}
.day:hover{border-color:var(--line-2)}
.day .wd{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.day .dd{font-family:var(--font-mono);font-size:16px;font-weight:600;line-height:1.5}
.day .meter{height:4px;border-radius:999px;background:var(--panel-3);margin:5px 7px 0;overflow:hidden}
.day .meter i{display:block;height:100%;background:var(--brand);border-radius:999px}
.day[data-today="1"] .dd{color:var(--brand)}
.day[aria-current="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.day.future{opacity:.5}

/* groups + tasks */
.group + .group{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.group > .gh{display:flex;align-items:center;gap:9px;padding:7px 12px 5px}
.group > .gh .ic{font-size:14px}
.group > .gh .nm{font-weight:700;font-size:12.5px;letter-spacing:.02em}
.group > .gh .ct{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}

.task{display:flex;gap:11px;align-items:flex-start;padding:9px 12px;border-radius:10px}
.task:hover{background:var(--panel-2)}
.task .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.task .row1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.task .ttl{font-weight:500;overflow-wrap:anywhere}
.task.done{opacity:.62}
.task.done:hover{opacity:1}
.task.done .ttl{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.task .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.task .desc{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.task .acts{display:flex;gap:4px;align-items:center;flex:none;opacity:.45}
.task:hover .acts,.task:focus-within .acts{opacity:1}
.iconbtn{border:0;background:transparent;color:var(--ink-3);cursor:pointer;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px}
.iconbtn:hover{background:var(--panel-3);color:var(--ink)}

.check{width:21px;height:21px;margin-top:2px;border:1.5px solid var(--line-2);border-radius:6px;background:transparent;
       display:grid;place-items:center;flex:none;cursor:pointer;color:transparent;transition:background .12s,border-color .12s}
.check:hover{border-color:var(--brand)}
.check[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.check svg{width:13px;height:13px}

.pipe{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.seg{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-3);border-radius:999px;
     padding:3px 10px;font-size:11.5px;cursor:pointer;line-height:1.7;white-space:nowrap}
.seg:hover{border-color:var(--brand);color:var(--brand)}
.seg.past{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink)}
.seg.cur{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.seg.cur.final{background:var(--ok);border-color:var(--ok)}
.stagebar{display:flex;gap:3px;align-items:center;margin-right:3px}
.stagebar i{width:12px;height:4px;border-radius:2px;background:var(--panel-3)}
.stagebar i.on{background:var(--brand)}

.note{display:block;width:100%;border:1px dashed var(--line-2);background:transparent;border-radius:8px;
      padding:6px 9px;font-size:12.5px;color:var(--ink-2)}
.note:focus{border-style:solid;border-color:var(--brand);background:var(--panel)}
.note::placeholder{color:var(--ink-3)}

.due{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel-3);color:var(--ink-2)}
.due.warn{background:var(--warn-soft);color:var(--warn)}
.due.crit{background:var(--crit-soft);color:var(--crit)}
.due.ok{background:var(--ok-soft);color:var(--ok)}
.tagchip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);border:1px solid var(--line);padding:1px 7px;border-radius:999px}

/* quick add */
.quick{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.quick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:8px 11px}
.quick input:focus{background:var(--panel);border-color:var(--brand);outline:none}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--on-accent);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink);border-color:var(--line-2)}
.btn.danger{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}

/* board header */
.boardhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.boardhead .ic{font-size:26px;line-height:1}
.boardhead h2{font-family:var(--font-display);margin:0;font-size:21px;font-weight:700}
.boardhead .sub{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.boardhead .sp{flex:1}

/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;
       width:min(560px,calc(100vw - 32px));box-shadow:0 24px 70px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(10,14,20,.5);backdrop-filter:blur(2px)}
dialog .dh{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
dialog .dh h3{margin:0;font-family:var(--font-display);font-size:17px;font-weight:700}
dialog .db{padding:16px 20px;display:flex;flex-direction:column;gap:14px;max-height:min(66dvh,560px);overflow:auto}
dialog .df{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
dialog .df .sp{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field > .lb{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.13em;color:var(--ink-3);text-transform:uppercase}
.field input[type=text],.field input[type=date],.field select,.field textarea{
  border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:9px 11px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--panel);border-color:var(--brand);outline:none}
.field textarea{resize:vertical;min-height:62px}
.hint{font-size:11.5px;color:var(--ink-3)}
.sublb{font-size:12px;color:var(--ink-2);white-space:nowrap}
.field .inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field .inline input[type=date],.field .inline input[type=number]{width:auto;flex:0 1 auto;min-width:130px}
.field .inline input[type=number]{min-width:84px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;align-items:center}
.datechip{display:inline-flex;align-items:center;gap:5px;background:var(--brand-soft);color:var(--brand-ink);
          border-radius:999px;padding:3px 5px 3px 11px;font-family:var(--font-mono);font-size:11.5px}
.datechip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;
                 padding:0 4px;border-radius:999px;opacity:.65}
.datechip button:hover{opacity:1;background:rgba(0,0,0,.08)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);
     border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--on-accent);font-weight:500}
.opt:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:28px;height:28px;border-radius:999px;border:2px solid transparent;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--panel)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){ .row2{grid-template-columns:1fr} }

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
       background:var(--ink);color:var(--desk);padding:9px 16px;border-radius:999px;font-size:13px;z-index:99;box-shadow:var(--shadow)}

/* ---------- narrow ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--desk)}
  .rail{position:static;max-height:none;background:var(--panel);border-bottom:1px solid var(--line);padding:16px;gap:16px}
  .rail-foot{margin-top:4px}
  .boards{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
  .board-btn{width:auto;flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px}
  .board-btn.overview{border-bottom:1px solid var(--line);border-radius:999px;margin-bottom:0;padding-bottom:6px}
  .board-btn .ct{display:none}
  .content{padding:14px 16px 56px}
  .topbar{padding:10px 16px}
  .week{gap:4px;padding:10px 8px}
  .day{padding:7px 2px 8px}
  .day .dd{font-size:14px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>日常工作台</h1>
      <span class="tag">Workbench</span>
    </div>

    <section>
      <div class="rail-head">
        <h2>用户</h2>
        <button class="mini" data-act="add-user" type="button">＋ 新用户</button>
      </div>
      <div class="users" id="users"></div>
    </section>

    <section>
      <div class="rail-head">
        <h2>板块</h2>
        <button class="mini" data-act="add-board" type="button">＋ 新板块</button>
      </div>
      <nav class="boards" id="boards"></nav>
    </section>

    <div class="rail-foot">
      <button class="mini" data-act="export" type="button" id="exportBtn" hidden>导出备份 JSON</button>
      <p id="storeNote">正在连接数据…</p>
    </div>
  </aside>

<script>
(function(){
"use strict";

/* ============ 基础工具 ============ */
var $ = function(s,r){ return (r||document).querySelector(s); };
var WD = ["日","一","二","三","四","五","六"];
var PALETTE = ["#8593A8","#C09A9A","#8C9A88","#C2A36B","#9B8AA6","#7FA0A0","#B58A80","#9A9188"];

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad(n){ return n<10?"0"+n:""+n; }
function toKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fromKey(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayKey(){ return toKey(new Date()); }
function addDays(k,n){ var d=fromKey(k); d.setDate(d.getDate()+n); return toKey(d); }
function mondayOf(k){ var d=fromKey(k); var w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return toKey(d); }
function diffDays(a,b){ return Math.round((fromKey(b)-fromKey(a))/86400000); }
function lastDayOf(monthKey){ var p=monthKey.split("-"); return new Date(+p[0], +p[1], 0).getDate(); }
function cnDate(k){ var d=fromKey(k); return (d.getMonth()+1)+"月"+d.getDate()+"日"; }
function uid(p){ return p+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-4); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ============ 初始示例（仅离线模式使用；联网数据由工作台自身保存） ============ */
var SEED_DAY = "2026-09-16";
var STARTER = {

    {id:"t_sw1", userId:"u_shuaige", boardId:"b_shuiwu",  title:"申报个人所得税（劳务报酬）", repeat:{kind:"monthly", day:15},    stages:[], note:"每月 15 号前完成申报", order:0, start:SEED_DAY},
    {id:"t_sw2", userId:"u_shuaige", boardId:"b_shuiwu",  title:"支付劳务报酬",             repeat:{kind:"monthly", day:"end"}, stages:[], note:"每月月底前付款", order:1, start:SEED_DAY},
    {id:"t_sw3", userId:"u_shuaige", boardId:"b_shuiwu",  title:"申报开票",                 repeat:{kind:"monthly", day:"end"}, stages:[], note:"每月月底前完成开票申报", order:2, start:SEED_DAY},
    {id:"t_mm1", userId:"u_xiaozhu", boardId:"b_meimei",  title:"今日稿件",                 repeat:{kind:"daily"},  stages:["大纲","初稿","作图","审核","发布"], note:"在下方备注里写今天的稿件主题", order:0, start:SEED_DAY},
    {id:"t_td1", userId:"u_xiaozhu", boardId:"b_tiandian",title:"今日甜点出品",             repeat:{kind:"daily"},  stages:["备料","制作","拍照"], note:"示例事项，可随时调整阶段", order:0, start:SEED_DAY},
    {id:"t_td2", userId:"u_xiaozhu", boardId:"b_tiandian",title:"采购原料",                 repeat:{kind:"weekly", days:[1]}, stages:[], note:"", order:1, start:SEED_DAY},

    {id:"t_rc2", userId:"u_xiaozhu", boardId:"b_richang", title:"运动 30 分钟",             repeat:{kind:"daily"},  stages:[], note:"", order:1, start:SEED_DAY},
    {id:"t_rc3", userId:"u_xiaozhu", boardId:"b_richang", title:"大扫除",                   repeat:{kind:"weekly", days:[6]}, stages:[], note:"", order:2, start:SEED_DAY},
    {id:"t_rc4", userId:"u_xiaozhu", boardId:"b_richang", title:"本周买菜囤货",             repeat:{kind:"weekany"}, stages:[], note:"本周内完成即可", order:3, start:SEED_DAY}
  ]
};

/* ============ 状态 ============ */
var state = {
  users:[], boards:[], tasks:[], logs:{},
  userId:null, boardId:"all", dateKey: todayKey(),
  openNotes:{}, readOnly:false, ready:false
};
var DB=null, downloadsCap=null, localMode=false, toastTimer=null;
var logSubs = {};

/* ============ 本地缓存 ============ */
var LS_DATA="workbench.data.v1", LS_PREF="workbench.pref.v1";
function persistLocal(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify({users:state.users,boards:state.boards,tasks:state.tasks,logs:state.logs})); }catch(e){}
}
function persistPref(){
  try{ localStorage.setItem(LS_PREF, JSON.stringify({userId:state.userId, boardId:state.boardId})); }catch(e){}
}
function loadPref(){
  try{ var p=JSON.parse(localStorage.getItem(LS_PREF)||"null"); if(p){ state.userId=p.userId||null; state.boardId=p.boardId||"all"; } }catch(e){}
}
function loadLocal(){
  var d=null;
  try{ d=JSON.parse(localStorage.getItem(LS_DATA)||"null"); }catch(e){}
  if(d && d.users && d.users.length){ state.users=d.users; state.boards=d.boards||[]; state.tasks=d.tasks||[]; state.logs=d.logs||{}; }
  else { state.users=clone(STARTER.users); state.boards=clone(STARTER.boards); state.tasks=clone(STARTER.tasks); state.logs={}; persistLocal(); }
}

/* ============ 任务周期逻辑 ============ */
function startedBy(task, key){
  if(!task.start) return true;
  if(key >= task.start) return true;
  return key >= todayKey();           /* 今天及以后永远可见，避免时钟差异把事项藏起来 */
}
function inWindow(task, key){
  var r = task.repeat || {}, isMonth = (key.length===7);
  var f = r.from ? (isMonth ? r.from.slice(0,7) : r.from) : null;
  var to = r.to  ? (isMonth ? r.to.slice(0,7)   : r.to)   : null;
  if(f && key < f) return false;
  if(to && key > to) return false;
  return true;
}
function occursOn(task, key){
  if(!startedBy(task,key)) return false;
  if(!inWindow(task,key)) return false;
  var r = task.repeat || {kind:"daily"};
  if(r.kind==="daily") return true;
  if(r.kind==="weekly") return (r.days||[]).indexOf(fromKey(key).getDay()) >= 0;
  if(r.kind==="once") return r.date===key;
  if(r.kind==="dates") return (r.list||[]).indexOf(key) >= 0;
  return false;                        /* weekany / monthly 单独成区 */
}
/* 「重复 N 次」在保存时换算成一个结束日期，渲染时就不必再逐日数 */
function nthOccurrence(rep, from, n){
  if(rep.kind==="monthly"){
    var d0 = fromKey(from);
    return toKey(new Date(d0.getFullYear(), d0.getMonth()+n, 0));
  }
  var count = 0, d = from;
  for(var i=0;i<1200;i++){
    var hit = (rep.kind==="daily") ? true
            : (rep.kind==="weekly") ? ((rep.days||[]).indexOf(fromKey(d).getDay()) >= 0)
            : (rep.kind==="weekany") ? (fromKey(d).getDay()===1)
            : true;
    if(hit){ count++; if(count>=n) return d; }
    d = addDays(d,1);
  }
  return d;
}
function periodOf(task, key){
  var r = task.repeat || {kind:"daily"};
  if(r.kind==="monthly") return key.slice(0,7);
  if(r.kind==="weekany") return mondayOf(key);
  return key;
}
function monthlyPeriod(task, monthKey){
  /* 截止日早于该事项创建日时，本期不算数，顺延到下一个月 */
  if(startedBy(task, monthlyDue(task, monthKey))) return monthKey;
  return addDays(monthKey+"-28", 10).slice(0,7);
}
function monthlyDue(task, monthKey){
  var last = lastDayOf(monthKey);
  var day = (task.repeat.day==="end") ? last : Math.min(+task.repeat.day||1, last);
  return monthKey+"-"+pad(day);
}
function entryOf(task, pk){
  var doc = state.logs[task.userId+"_"+pk.slice(0,7)];
  return (doc && doc[task.id+"__"+pk]) || null;
}
function isDone(task, pk){
  var e = entryOf(task, pk); if(!e) return false;
  if(task.stages && task.stages.length) return (typeof e.s==="number") && e.s >= task.stages.length-1;
  return !!e.d;
}
function stageOf(task, pk){
  var e = entryOf(task, pk);
  return (e && typeof e.s==="number") ? e.s : -1;
}

/* ============ 选择与筛选 ============ */
function currentUser(){ var u=null; state.users.forEach(function(x){ if(x.id===state.userId) u=x; }); return u; }
function userBoards(){
  return state.boards.filter(function(b){ return b.userId===state.userId; })
                     .sort(function(a,b){ return (a.order||0)-(b.order||0); });
}
function scopeTasks(){
  return state.tasks.filter(function(t){
    if(t.userId!==state.userId || t.archived) return false;
    if(state.boardId!=="all" && t.boardId!==state.boardId) return false;
    return true;
  }).sort(function(a,b){ return (a.order||0)-(b.order||0); });
}
function boardOf(id){ var r=null; state.boards.forEach(function(b){ if(b.id===id) r=b; }); return r; }
function taskOf(id){ var r=null; state.tasks.forEach(function(t){ if(t.id===id) r=t; }); return r; }

/* 未完成在前、已完成沉底；sort 是稳定的，组内原有顺序保持不变 */
function sinkDone(items){
  return items.slice().sort(function(a,b){
    return (isDone(a.task,a.pk)?1:0) - (isDone(b.task,b.pk)?1:0);
  });
}
function dayStats(tasks, key){
  var total=0, done=0;
  tasks.forEach(function(t){ if(occursOn(t,key)){ total++; if(isDone(t,key)) done++; } });
  return {total:total, done:done};
}
function streakOf(tasks){
  var n=0, cur=todayKey(), s=dayStats(tasks,cur);
  if(!(s.total>0 && s.done===s.total)) cur=addDays(cur,-1);
  for(var i=0;i<60;i++){
    var d=dayStats(tasks,cur);
    if(d.total===0){ cur=addDays(cur,-1); continue; }
    if(d.done===d.total){ n++; cur=addDays(cur,-1); } else break;
  }
  return n;
}
function overdueList(tasks){
  var out=[], today=todayKey();
  for(var i=14;i>=1;i--){
    var k=addDays(today,-i);
    tasks.forEach(function(t){ if(occursOn(t,k) && !isDone(t,k)) out.push({task:t, pk:k}); });
  }
  tasks.forEach(function(t){
    if(t.repeat && t.repeat.kind==="monthly"){
      var m=monthlyPeriod(t, today.slice(0,7));
      if(m===today.slice(0,7) && inWindow(t,m)){
        var due=monthlyDue(t,m);
        if(today>due && !isDone(t,m)) out.push({task:t, pk:m, due:due});
      }
    }
    if(t.repeat && t.repeat.kind==="weekany"){
      var prev=addDays(mondayOf(today),-7);
      if(startedBy(t,prev) && inWindow(t,prev) && !isDone(t,prev)) out.push({task:t, pk:prev});
    }
  });
  return out;
}

/* ============ 写入 ============ */
function toast(msg){
  var old=$(".toast"); if(old) old.remove();
  var n=document.createElement("div"); n.className="toast"; n.textContent=msg; document.body.appendChild(n);
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ n.remove(); }, 2600);
}
function setNote(txt){ var n=$("#storeNote"); if(n) n.textContent=txt; }
function onWriteFail(e){
  var code = e && e.code;
  if(code==="invalid_argument"){ state.readOnly=true; setNote("只读访问 · 改动无法保存"); toast("当前账号没有写入权限，改动未保存"); }
  else if(code==="quota_exceeded"){ toast("存储条目已满，请删除一些旧数据"); }
  else if(code==="revoked"){ state.readOnly=true; toast("访问权限已变更，请刷新页面"); }
  else { toast("保存失败，请稍后重试"); }
  render();
}
function saveCfg(key){
  persistLocal();
  render();
  if(!DB) return Promise.resolve();
  var body={}; body.list=state[key]; body.updatedAt=Date.now();
  return DB.doc("config/"+key).set(body).catch(onWriteFail);
}
function saveEntry(task, pk, patch){
  var docId = task.userId+"_"+pk.slice(0,7), key = task.id+"__"+pk;
  var doc = state.logs[docId] || (state.logs[docId]={});
  var next = {}; var prev = doc[key]||{};
  Object.keys(prev).forEach(function(k){ next[k]=prev[k]; });
  Object.keys(patch).forEach(function(k){ next[k]=patch[k]; });
  doc[key]=next;
  persistLocal(); render();
  if(!DB) return;
  var payload={entries:{}}; payload.entries[key]=next;
  var ref = DB.doc("logs/"+docId);
  ref.update(payload).catch(function(){
    return ref.set({userId:task.userId, month:pk.slice(0,7), entries: state.logs[docId]});
  }).catch(onWriteFail);
}

/* ============ 渲染：左侧导轨 ============ */
function renderRail(){
  var u=$("#users");
  u.innerHTML = state.users.map(function(x){
    var on = x.id===state.userId;
    return '<button class="user" type="button" data-act="user" data-id="'+esc(x.id)+'" aria-pressed="'+on+'"'
      + ' style="--u-color:'+esc(x.color)+'">'
      + '<span class="dot" style="background:'+esc(x.color)+'">'+esc(x.emoji||"●")+'</span>'+esc(x.name)+'</button>';
  }).join("") || '<p class="hint">还没有用户，点「＋ 新用户」开始。</p>';

  var today = todayKey();
  var mine = state.tasks.filter(function(t){ return t.userId===state.userId && !t.archived; });
  var all = dayStats(mine, today);
  var html = '<button class="board-btn overview" type="button" data-act="board" data-id="all" aria-current="'+(state.boardId==="all")+'">'
    + '<span class="ic">◎</span><span class="nm">综合总览</span><span class="ct mono">'+all.done+"/"+all.total+'</span></button>';
  html += userBoards().map(function(b){
    var ts = mine.filter(function(t){ return t.boardId===b.id; });
    var s = dayStats(ts, today), ct;
    if(s.total){ ct = s.done+"/"+s.total; }
    else {
      var open = 0, wk = mondayOf(today);
      ts.forEach(function(t){
        var kind = (t.repeat||{}).kind;
        if(kind==="monthly" && startedBy(t,today) && !isDone(t, monthlyPeriod(t, today.slice(0,7)))) open++;
        if(kind==="weekany" && startedBy(t,wk) && !isDone(t,wk)) open++;
      });
      ct = open ? "待办 "+open : "—";
    }
    return '<button class="board-btn" type="button" data-act="board" data-id="'+esc(b.id)+'" aria-current="'+(state.boardId===b.id)+'">'
      + '<span class="ic">'+esc(b.icon||"▪")+'</span><span class="nm">'+esc(b.name)+'</span>'
      + '<span class="ct mono">'+ct+'</span></button>';
  }).join("");
  $("#boards").innerHTML = html;
}

/* ============ 渲染：顶栏 ============ */
function ringSVG(pct){
  var r=15, c=2*Math.PI*r, off=c*(1-pct);
  return '<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">'
    + '<circle cx="18" cy="18" r="'+r+'" fill="none" stroke="var(--panel-3)" stroke-width="4"></circle>'
    + '<circle cx="18" cy="18" r="'+r+'" fill="none" stroke="var(--brand)" stroke-width="4" stroke-linecap="round"'
    + ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 18 18)"></circle></svg>';
}
function renderTopbar(){
  var k=state.dateKey, d=fromKey(k), today=todayKey(), delta=diffDays(today,k);
  var rel = delta===0 ? "今天" : delta===1 ? "明天" : delta===-1 ? "昨天" : (delta>0 ? delta+"天后" : (-delta)+"天前");
  var s = dayStats(scopeTasks(), k);
  var pct = s.total ? s.done/s.total : 0;
  $("#topbar").innerHTML =
    '<div class="datenav">'
    + '<button class="nav-btn" type="button" data-act="day" data-n="-1" aria-label="前一天">‹</button>'
    + '<button class="nav-btn" type="button" data-act="day" data-n="1" aria-label="后一天">›</button>'
    + '<button class="today-btn" type="button" data-act="today">今天</button></div>'
    + '<div class="bigdate"><span class="d">'+(d.getMonth()+1)+'月'+d.getDate()+'日</span>'
    + '<span class="w mono">周'+WD[d.getDay()]+' · '+k+'</span>'
    + (delta===0 ? '' : '<span class="rel">'+rel+'</span>')
    + '</div><div class="spacer"></div>'
    + '<div class="ring">'+ringSVG(pct)+'<span class="txt"><b>'+s.done+'</b> / '+s.total+' 当日事项</span></div>'
    + '<button class="btn" type="button" data-act="add-task">＋ 添加事项</button>';
}

/* ============ 渲染：任务行 ============ */
var CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function dueChip(task, monthKey){
  var due = monthlyDue(task, monthKey), today=todayKey(), left = diffDays(today, due);
  if(isDone(task, monthKey)) return '<span class="due ok">已完成 · 截止 '+cnDate(due)+'</span>';
  if(left<0)  return '<span class="due crit">已逾期 '+(-left)+' 天 · 截止 '+cnDate(due)+'</span>';
  if(left===0) return '<span class="due crit">今天截止</span>';
  if(left<=3) return '<span class="due warn">还有 '+left+' 天 · '+cnDate(due)+' 前</span>';
  return '<span class="due">还有 '+left+' 天 · '+cnDate(due)+' 前</span>';
}
function repeatLabel(t){
  var r=t.repeat||{kind:"daily"}, base="";
  if(r.kind==="daily") base="每天";
  else if(r.kind==="weekly") base="每周"+(r.days||[]).map(function(d){ return WD[d]; }).join("·");
  else if(r.kind==="weekany") base="每周内";
  else if(r.kind==="monthly") base = (r.day==="end") ? "每月底前" : "每月"+r.day+"号前";
  else if(r.kind==="once") return "单次 "+cnDate(r.date);
  else if(r.kind==="dates") return "自定义 "+((r.list||[]).length)+" 天";
  if(r.times) return base+" · 共"+r.times+"次";
  if(r.to) return base+" · 至"+cnDate(r.to);
  if(r.from) return base+" · 自"+cnDate(r.from);
  return base;
}
function taskRow(task, pk, opts){
  opts = opts||{};
  var staged = !!(task.stages && task.stages.length);
  var done = isDone(task, pk);
  var e = entryOf(task, pk);
  var st = stageOf(task, pk);
  var noteKey = task.id+"__"+pk;
  var showNote = staged || state.openNotes[noteKey] || (e && e.n);

  var h = '<div class="task'+(done?" done":"")+'" data-task="'+esc(task.id)+'">';
  h += '<button class="check" type="button" data-act="toggle" data-id="'+esc(task.id)+'" data-pk="'+esc(pk)+'"'
     + ' aria-pressed="'+done+'" aria-label="'+(done?"取消完成":"标记完成")+'：'+esc(task.title)+'">'+CHECK_SVG+'</button>';
  h += '<div class="main"><div class="row1"><span class="ttl">'+esc(task.title)+'</span>';
  if(opts.boardTag){ var b=boardOf(task.boardId); if(b) h += '<span class="tagchip">'+esc(b.icon||"")+" "+esc(b.name)+'</span>'; }
  if(opts.showRepeat) h += '<span class="tagchip">'+esc(repeatLabel(task))+'</span>';
  if(opts.dueMonth) h += dueChip(task, pk);
  if(opts.dayLabel) h += '<span class="meta">'+cnDate(pk)+' 周'+WD[fromKey(pk).getDay()]+'</span>';
  if(done && e && e.t && !opts.dueMonth) h += '<span class="meta">✓ '+new Date(e.t).toTimeString().slice(0,5)+'</span>';
  h += '</div>';

  if(staged){
    var bars='';
    for(var i=0;i<task.stages.length;i++) bars += '<i class="'+(i<=st?"on":"")+'"></i>';
    h += '<div class="pipe"><span class="stagebar" aria-hidden="true">'+bars+'</span>';
    h += task.stages.map(function(name,i){
      var cls = i<st ? "past" : (i===st ? "cur"+(i===task.stages.length-1?" final":"") : "");
      return '<button class="seg '+cls+'" type="button" data-act="stage" data-id="'+esc(task.id)+'" data-pk="'+esc(pk)+'" data-i="'+i+'"'
        + ' title="标记到「'+esc(name)+'」'+(i===st?"（再点一次退回上一步）":"")+'">'+esc(name)+'</button>';
    }).join("");
    h += '</div>';
  } else if(task.note && !opts.compact){
    h += '<div class="desc">'+esc(task.note)+'</div>';
  }

  if(showNote && !opts.compact){
    h += '<input class="note" type="text" id="note-'+esc(noteKey)+'" data-note="'+esc(task.id)+'" data-pk="'+esc(pk)+'"'
       + ' value="'+esc(e&&e.n?e.n:"")+'" placeholder="'+(staged?"今天的主题 / 备注…":"备注…")+'">';
  }
  h += '</div>';
  h += '<div class="acts">';
  if(!staged) h += '<button class="iconbtn" type="button" data-act="note" data-id="'+esc(task.id)+'" data-pk="'+esc(pk)+'" title="备注" aria-label="备注">✎</button>';
  h += '<button class="iconbtn" type="button" data-act="edit-task" data-id="'+esc(task.id)+'" title="编辑事项" aria-label="编辑事项">⋯</button>';
  h += '</div></div>';
  return h;
}

/* ============ 渲染：正文 ============ */
function panel(title, sub, bodyHTML, extraHeader){
  return '<section class="panel"><header><h3>'+title+'</h3>'
    + (sub?'<span class="sub mono">'+sub+'</span>':'')
    + '<span class="sp"></span>'+(extraHeader||"")+'</header>'+bodyHTML+'</section>';
}
function groupByBoard(items, opts){
  var byBoard={}, order=[];
  items.forEach(function(it){
    if(!byBoard[it.task.boardId]){ byBoard[it.task.boardId]=[]; order.push(it.task.boardId); }
    byBoard[it.task.boardId].push(it);
  });
  var boards = userBoards().map(function(b){ return b.id; }).filter(function(id){ return byBoard[id]; });
  order.forEach(function(id){ if(boards.indexOf(id)<0) boards.push(id); });
  /* 整组做完的板块也沉到最下方 */
  boards.sort(function(a,b){
    function allDone(id){ return byBoard[id].every(function(it){ return isDone(it.task, it.pk); }) ? 1 : 0; }
    return allDone(a) - allDone(b);
  });
  return boards.map(function(id){
    var b = boardOf(id) || {name:"未分类", icon:"▪"};
    var list = sinkDone(byBoard[id]);
    var doneN = list.filter(function(it){ return isDone(it.task, it.pk); }).length;
    return '<div class="group"><div class="gh"><span class="ic">'+esc(b.icon||"▪")+'</span>'
      + '<span class="nm">'+esc(b.name)+'</span><span class="ct">'+doneN+'/'+list.length+'</span></div>'
      + list.map(function(it){ return taskRow(it.task, it.pk, opts); }).join("")+'</div>';
  }).join("");
}

function renderContent(){
  var c = $("#content");
  if(!state.users.length){
    c.innerHTML = '<section class="panel"><div class="empty">还没有用户。<br><br>'
      + '<button class="btn" type="button" data-act="add-user">创建第一个用户</button></div></section>';
    return;
  }
  var tasks = scopeTasks(), key = state.dateKey, today = todayKey();
  var board = state.boardId==="all" ? null : boardOf(state.boardId);
  var mine = state.tasks.filter(function(t){ return t.userId===state.userId && !t.archived; });
  var out = "";

  /* — 板块标题 — */
  if(board){
    out += '<div class="boardhead"><span class="ic">'+esc(board.icon||"▪")+'</span>'
      + '<h2>'+esc(board.name)+'</h2>'
      + '<span class="sub">'+tasks.length+' 个事项</span><span class="sp"></span>'
      + '<button class="btn ghost" type="button" data-act="edit-board" data-id="'+esc(board.id)+'">板块设置</button>'
      + '<button class="btn" type="button" data-act="add-task">＋ 新建事项</button></div>';
  }

  /* — 提醒条 — */
  var dayItems = sinkDone(tasks.filter(function(t){ return occursOn(t,key); }).map(function(t){ return {task:t, pk:key}; }));
  var pending = dayItems.filter(function(it){ return !isDone(it.task, it.pk); });
  var monthly = tasks.filter(function(t){ return (t.repeat||{}).kind==="monthly" && startedBy(t, today) && inWindow(t, key.slice(0,7)); });
  var soon = [];
  monthly.forEach(function(t){
    var m = monthlyPeriod(t, today.slice(0,7));
    if(isDone(t,m)) return;
    var left = diffDays(today, monthlyDue(t,m));
    if(left<=5) soon.push({task:t, left:left});
  });
  var overdue = overdueList(tasks);
  var chips = [];
  if(pending.length) chips.push('<span class="rchip'+(diffDays(today,key)===0?" warn":"")+'">今日待办 <b>'+pending.length+'</b> 项</span>');
  soon.forEach(function(it){
    var left = it.left;
    chips.push('<span class="rchip '+(left<=1?"crit":"warn")+'">'+esc(it.task.title)+' · '
      + (left<0 ? "逾期"+(-left)+"天" : (left===0 ? "今天截止" : left+"天后截止"))+'</span>');
  });
  if(overdue.length) chips.push('<span class="rchip crit">未补完 <b>'+overdue.length+'</b> 项</span>');
  if(!chips.length) chips.push('<span class="rchip ok">今天的事都做完了，没有临近的截止</span>');
  var alert = (soon.length || overdue.length) ? " alert" : "";
  out += '<div class="band'+alert+'"><div class="flag">提醒</div><div class="items">'+chips.join("")+'</div></div>';

  /* — 统计 — */
  var wkStart = mondayOf(key), wkDone=0, wkTotal=0;
  for(var i=0;i<7;i++){ var s=dayStats(tasks, addDays(wkStart,i)); wkDone+=s.done; wkTotal+=s.total; }
  var ds = dayStats(tasks, key);
  var stk = streakOf(tasks);
  out += '<div class="stats">'
    + '<div class="stat"><div class="k">当日进度</div><div class="v">'+ds.done+'<small> / '+ds.total+'</small></div><div class="n">'+cnDate(key)+'</div></div>'
    + '<div class="stat"><div class="k">本周进度</div><div class="v">'+wkDone+'<small> / '+wkTotal+'</small></div><div class="n">'+cnDate(wkStart)+' 起</div></div>'
    + '<div class="stat'+(overdue.length?" hot":"")+'"><div class="k">待补事项</div><div class="v">'+overdue.length+'</div><div class="n">近 14 天未完成</div></div>'
    + '<div class="stat'+(stk>0?"":" warm")+'"><div class="k">连续全勤</div><div class="v">'+stk+'<small> 天</small></div><div class="n">'+(stk>0?"保持住":"从今天开始")+'</div></div>'
    + '</div>';

  /* — 本周 — */
  var weekCells = "";
  for(var j=0;j<7;j++){
    var dk = addDays(wkStart,j), st2 = dayStats(tasks,dk), p = st2.total? st2.done/st2.total : 0;
    weekCells += '<button class="day'+(dk>today?" future":"")+'" type="button" data-act="jump" data-date="'+dk+'"'
      + ' aria-current="'+(dk===key)+'" data-today="'+(dk===today?1:0)+'" aria-label="'+cnDate(dk)+'">'
      + '<div class="wd">周'+WD[fromKey(dk).getDay()]+'</div><div class="dd">'+fromKey(dk).getDate()+'</div>'
      + '<div class="meter"><i style="width:'+Math.round(p*100)+'%"></i></div></button>';
  }
  out += panel("本周节奏", cnDate(wkStart)+" – "+cnDate(addDays(wkStart,6)), '<div class="week">'+weekCells+'</div>');

  /* — 当日事项 — */
  var dayBody;
  if(dayItems.length){
    dayBody = '<div class="body">' + (state.boardId==="all"
      ? groupByBoard(dayItems, {})
      : dayItems.map(function(it){ return taskRow(it.task, it.pk, {showRepeat:true}); }).join("")) + '</div>';
  } else {
    dayBody = '<div class="empty">'+cnDate(key)+'没有安排的事项。可以在下面加一个临时事项。</div>';
  }
  dayBody += '<div class="quick"><input type="text" id="quickadd" placeholder="为 '+cnDate(key)+' 添加一个临时事项，回车确认…" aria-label="临时事项">'
    + '<button class="btn" type="button" data-act="quick">添加</button>'
    + (board ? '' : '<button class="btn ghost" type="button" data-act="add-task">＋ 重复事项</button>')+'</div>';
  out += panel(diffDays(today,key)===0 ? "今日事项" : cnDate(key)+" 事项",
               ds.done+" / "+ds.total, dayBody);

  /* — 本周内完成 — */
  var weekAny = tasks.filter(function(t){ return (t.repeat||{}).kind==="weekany" && startedBy(t, key) && inWindow(t, key); });
  if(weekAny.length){
    var items = sinkDone(weekAny.map(function(t){ return {task:t, pk:wkStart}; }));
    var dn = items.filter(function(it){ return isDone(it.task,it.pk); }).length;
    out += panel("本周内完成", dn+" / "+items.length,
      '<div class="body">'+(state.boardId==="all" ? groupByBoard(items,{}) :
        items.map(function(it){ return taskRow(it.task,it.pk,{}); }).join(""))+'</div>');
  }

  /* — 本月截止 — */
  if(monthly.length){
    var mk = key.slice(0,7);
    var mItems = monthly.map(function(t){ return {task:t, pk:monthlyPeriod(t, mk)}; })
      .sort(function(a,b){ return monthlyDue(a.task,a.pk) < monthlyDue(b.task,b.pk) ? -1 : 1; });
    mItems = sinkDone(mItems);
    var mDone = mItems.filter(function(it){ return isDone(it.task,it.pk); }).length;
    out += panel("月度截止事项", mDone+" / "+mItems.length,
      '<div class="body">'+(state.boardId==="all"
        ? groupByBoard(mItems,{dueMonth:true})
        : mItems.map(function(it){ return taskRow(it.task,it.pk,{dueMonth:true}); }).join(""))+'</div>');
  }

  /* — 待补 — */
  if(overdue.length){
    out += panel("待补事项", "近 14 天",
      '<div class="body">'+overdue.slice(0,40).map(function(it){
        return taskRow(it.task, it.pk, {boardTag:state.boardId==="all", dayLabel:(it.pk.length>7), dueMonth:(it.pk.length===7), compact:true});
      }).join("")+'</div>');
  }

  /* — 空板块 — */
  if(!tasks.length){
    out += '<section class="panel"><div class="empty">'
      + (board ? '「'+esc(board.name)+'」还没有事项。' : '这个用户还没有事项。')
      + '<br><br><button class="btn" type="button" data-act="add-task">＋ 新建重复事项</button></div></section>';
  }
  c.innerHTML = out;
}

      + '<input type="text" id="f-stages" value="'+esc(stages.join("、"))+'" placeholder="用「、」分隔，例如：选题、拍摄、剪辑、发布">'
      + '<span class="hint">设置阶段后，这件事每期会显示一条进度，点阶段即可标注当前状态。</span></div>'
    + '<div class="field"><span class="lb">说明（可选）</span><textarea id="f-note" placeholder="固定说明，显示在事项下方">'+esc(t?(t.note||""):"")+'</textarea></div>',
    onReady: function(d){
      function drawChips(){
        picked.sort();
        d.querySelector("#f-chips").innerHTML = picked.length
          ? picked.map(function(k){
              return '<span class="datechip">'+cnDate(k)+'<button type="button" data-rm="'+k+'" aria-label="移除 '+cnDate(k)+'">×</button></span>';
            }).join("")
          : '<span class="hint">还没有选日期</span>';
      }
      function sync(){
        var checked = d.querySelector("input[name=f-kind]:checked");
        var k = checked ? checked.value : "daily";
        d.querySelector("#w-weekly").hidden = (k!=="weekly");
        d.querySelector("#w-monthly").hidden = (k!=="monthly");
        d.querySelector("#w-once").hidden = (k!=="once");
        d.querySelector("#w-dates").hidden = (k!=="dates");
        d.querySelector("#w-span").hidden = (k==="once" || k==="dates");
        var sc = d.querySelector("input[name=f-span]:checked");
        var sp = sc ? sc.value : "forever";
        d.querySelector("#w-from").hidden = (sp==="forever");
        d.querySelector("#w-to").hidden = (sp!=="range");
        d.querySelector("#w-times").hidden = (sp!=="times");
        var p = d.querySelector("#f-preset").value;
        var sf = d.querySelector("#f-stages");
        sf.hidden = (p!=="custom");
        if(p && p!=="custom") sf.value = STAGE_PRESETS[p].join("、");
        if(p==="") sf.value = "";
      }
      d.querySelector("#f-kinds").addEventListener("change", sync);
      d.querySelector("#f-spans").addEventListener("change", sync);
      d.querySelector("#f-preset").addEventListener("change", sync);
      d.querySelector("#f-dateadd").addEventListener("click", function(){
        var v = d.querySelector("#f-datepick").value;
        if(v && picked.indexOf(v)<0){ picked.push(v); drawChips(); }
      });
      d.querySelector("#f-chips").addEventListener("click", function(ev){
        var rm = ev.target.getAttribute && ev.target.getAttribute("data-rm");
        if(rm){ picked = picked.filter(function(x){ return x!==rm; }); drawChips(); }
      });
      drawChips(); sync();
      var del = d.querySelector("[data-del]");
      if(del) del.addEventListener("click", function(){
        if(!confirm("删除事项「"+t.title+"」？历史打卡记录会保留但不再显示。")) return;
        state.tasks = state.tasks.filter(function(x){ return x.id!==t.id; });
        saveCfg("tasks"); d.close();
      });
    },
    onSubmit: function(d){
      var title = d.querySelector("#f-title").value.trim();
      if(!title){ toast("请填写事项名称"); return false; }
      var checked = d.querySelector("input[name=f-kind]:checked");
      var k = checked ? checked.value : "daily";
      var rep = {kind:k};
      if(k==="weekly"){
        rep.days = Array.prototype.slice.call(d.querySelectorAll("input[name=f-day]:checked")).map(function(x){ return Number(x.value); });
        if(!rep.days.length){ toast("请至少选择一个星期"); return false; }
      }
      if(k==="monthly"){ var v=d.querySelector("#f-monthday").value; rep.day = (v==="end") ? "end" : Number(v); }
      if(k==="once"){ rep.date = d.querySelector("#f-date").value || state.dateKey; }
      if(k==="dates"){
        if(!picked.length){ toast("请至少添加一个日期"); return false; }
        rep.list = picked.slice().sort();
      }
      if(k!=="once" && k!=="dates"){
        var sc = d.querySelector("input[name=f-span]:checked");
        var sp = sc ? sc.value : "forever";
        if(sp==="range"){
          var from = d.querySelector("#f-from").value, to = d.querySelector("#f-to").value;
          if(from) rep.from = from;
          if(to) rep.to = to;
          if(rep.from && rep.to && rep.to < rep.from){ toast("结束日期不能早于开始日期"); return false; }
        }
        if(sp==="times"){
          var n = Number(d.querySelector("#f-times").value)||1;
          rep.from = d.querySelector("#f-from").value || todayKey();
          rep.times = n;
          rep.to = nthOccurrence(rep, rep.from, n);
        }
      }
      var p = d.querySelector("#f-preset").value;
      var stg = [];
      if(p && p!=="custom") stg = STAGE_PRESETS[p].slice();
      else if(p==="custom") stg = d.querySelector("#f-stages").value.split(SPLIT_RE).map(function(s){ return s.trim(); }).filter(Boolean);
      var note = d.querySelector("#f-note").value.trim();
      var bId = d.querySelector("#f-board").value;
      if(t){ t.title=title; t.boardId=bId; t.repeat=rep; t.stages=stg; t.note=note; }
      else {
        state.tasks.push({id:uid("t_"), userId:state.userId, boardId:bId, title:title, repeat:rep,
                          stages:stg, note:note, order:state.tasks.length, start:todayKey()});
      }
      saveCfg("tasks");
    }
  });
}

/* ============ 交互 ============ */
document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!b) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), pk = b.getAttribute("data-pk");
  if(act==="user"){ if(state.userId!==id){ state.userId=id; state.boardId="all"; persistPref(); syncLogSubs(); render(); } return; }
  if(act==="board"){ state.boardId=id; persistPref(); render(); window.scrollTo({top:0, behavior:"smooth"}); return; }
  if(act==="add-user"){ openUserDialog(null); return; }
  if(act==="edit-user"){ openUserDialog(id); return; }
  if(act==="add-board"){ openBoardDialog(null); return; }
  if(act==="edit-board"){ openBoardDialog(id); return; }
  if(act==="add-task"){ openTaskDialog(null); return; }
  if(act==="edit-task"){ openTaskDialog(id); return; }
  if(act==="day"){ state.dateKey = addDays(state.dateKey, Number(b.getAttribute("data-n"))); syncLogSubs(); render(); return; }
  if(act==="today"){ state.dateKey = todayKey(); syncLogSubs(); render(); return; }
  if(act==="jump"){ state.dateKey = b.getAttribute("data-date"); syncLogSubs(); render(); return; }
  if(act==="export"){ doExport(); return; }
  if(act==="note"){
    var nk = id+"__"+pk;
    if(state.openNotes[nk]) delete state.openNotes[nk]; else state.openNotes[nk]=1;
    render();
    var f = document.getElementById("note-"+nk); if(f) f.focus();
    return;
  }
  if(act==="toggle"){
    var t = taskOf(id); if(!t) return;
    var done = isDone(t, pk);
    var last = (t.stages && t.stages.length) ? t.stages.length-1 : -1;
    saveEntry(t, pk, done ? {d:false, s:-1, t:Date.now()} : {d:true, s:last, t:Date.now()});
    return;
  }
  if(act==="stage"){
    var t2 = taskOf(id); if(!t2) return;
    var i = Number(b.getAttribute("data-i")), cur = stageOf(t2, pk);
    var next = (cur===i) ? i-1 : i;
    saveEntry(t2, pk, {s:next, d:(next >= t2.stages.length-1), t:Date.now()});
    return;
  }
  if(act==="quick"){ quickAdd(); return; }
});
document.addEventListener("keydown", function(ev){
  if(ev.key==="Enter" && ev.target && ev.target.id==="quickadd"){ ev.preventDefault(); quickAdd(); }
});
document.addEventListener("change", function(ev){
  var n = ev.target;
  if(n && n.hasAttribute && n.hasAttribute("data-note")){
    var t = taskOf(n.getAttribute("data-note"));
    if(t) saveEntry(t, n.getAttribute("data-pk"), {n:n.value.trim()});
  }
});
function quickAdd(){
  var inp = $("#quickadd"); if(!inp) return;
  var v = inp.value.trim(); if(!v) return;
  var boards = userBoards();
  if(!boards.length){ toast("请先创建一个板块"); openBoardDialog(null); return; }
  var bId = (state.boardId!=="all") ? state.boardId : boards[0].id;
  state.tasks.push({id:uid("t_"), userId:state.userId, boardId:bId, title:v,
                    repeat:{kind:"once", date:state.dateKey}, stages:[], note:"",
                    order:state.tasks.length, start:state.dateKey});
  inp.value = "";
  saveCfg("tasks");
  toast("已添加到 "+cnDate(state.dateKey));
}

/* ============ 导出备份 ============ */
function doExport(){
  if(!downloadsCap){ toast("当前环境不支持导出"); return; }
  var payload = JSON.stringify({
    exportedAt:new Date().toISOString(), version:1,
    users:state.users, boards:state.boards, tasks:state.tasks, logs:state.logs
  }, null, 2);
  downloadsCap.save({ filename:"工作台备份-"+todayKey()+".json", data:payload })
    .then(function(){ toast("备份已保存"); })
    .catch(function(){ toast("未保存备份"); });
}

/* ============ 数据连接 ============ */
function normalizeSelection(){
  var ids = state.users.map(function(u){ return u.id; });
  if(!state.userId || ids.indexOf(state.userId)<0) state.userId = ids.length ? ids[0] : null;
  if(state.boardId!=="all"){
    var b = boardOf(state.boardId);
    if(!b || b.userId!==state.userId) state.boardId = "all";
  }
}
function neededDocIds(){
  if(!state.userId) return [];
  var months = {}, t = todayKey();
  [state.dateKey, addDays(state.dateKey,-32), addDays(state.dateKey,32), t, addDays(t,-32)]
    .forEach(function(k){ months[k.slice(0,7)] = 1; });
  return Object.keys(months).map(function(m){ return state.userId+"_"+m; });
}
function syncLogSubs(){
  if(!DB) return;
  var need = {};
  neededDocIds().forEach(function(id){ need[id] = 1; });
  Object.keys(logSubs).forEach(function(id){
    if(!need[id]){ try{ logSubs[id](); }catch(e){} delete logSubs[id]; }
  });
  Object.keys(need).forEach(function(id){
    if(logSubs[id]) return;
    logSubs[id] = DB.doc("logs/"+id).onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      /* 快照对象是冻结的，拷贝一份再用，否则严格模式下写入会抛异常 */
      state.logs[id] = (d && d.entries) ? clone(d.entries) : {};
      persistLocal(); render();
    }, function(e){
      if(e && e.code==="revoked"){ state.readOnly = true; setNote("访问权限已变更"); }
    });
  });
}
function attachConfig(){
  ["users","boards","tasks"].forEach(function(k){
    DB.doc("config/"+k).onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      state[k] = (d && Array.isArray(d.list)) ? clone(d.list) : [];
      state.ready = true;
      normalizeSelection(); syncLogSubs(); persistLocal(); render();
    }, function(e){
      if(e && e.code==="revoked"){ state.readOnly = true; setNote("访问权限已变更"); render(); }
    });
  });
}
function boot(){
  loadPref();
  render();
  var c = window.claude;
  var p = (c && typeof c.use === "function")
    ? Promise.all([
        c.use("db").catch(function(){ return null; }),
        c.use("downloads").catch(function(){ return null; })
      ])
    : Promise.resolve([null, null]);
  p.then(function(res){
    DB = res[0]; downloadsCap = res[1];
    var eb = $("#exportBtn"); if(eb) eb.hidden = !downloadsCap;
    if(DB){ setNote("已连接 · 改动自动保存，多设备同步"); attachConfig(); }
    else {
      localMode = true; loadLocal(); normalizeSelection();
      setNote("离线模式 · 数据保存在本浏览器");
      render();
    }
  });
}
boot();
})();
</script>
