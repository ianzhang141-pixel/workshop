<meta charset="utf-8">
<title>工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
:root{
  --desk:#EAE3D8; --panel:#FAF6F0; --panel-2:#F2ECE2; --panel-3:#E6DDCF;
  --ink:#3B352F; --ink-2:#6F655B; --ink-3:#A0958A;
  --line:#DFD5C6; --line-2:#C9BCA8;
  --brand:#7E9080; --brand-ink:#5E6F60; --brand-soft:#E0E6DC;
  --ok:#7E9080; --ok-soft:#E0E6DC;
  --warn:#BF9455; --warn-soft:#F5E9D5;
  --crit:#B47B72; --crit-soft:#F2E1DC;
  --on-accent:#FAF6F0;
  --shadow:0 1px 2px rgba(78,64,48,.06), 0 10px 26px -16px rgba(78,64,48,.30);
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-display:"Noto Serif SC","Songti SC","SimSun",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#211D19; --panel:#2A2521; --panel-2:#332D27; --panel-3:#3D362E;
    --ink:#EDE5D9; --ink-2:#B5AA9C; --ink-3:#8B8072;
    --line:#3C352D; --line-2:#50473C;
    --brand:#9DB39C; --brand-ink:#B8CAB6; --brand-soft:#2F382E;
    --ok:#9DB39C; --ok-soft:#2F382E;
    --warn:#D6AF74; --warn-soft:#3E321E;
    --crit:#CE988D; --crit-soft:#3C2A25;
    --on-accent:#211D19;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --desk:#211D19; --panel:#2A2521; --panel-2:#332D27; --panel-3:#3D362E;
  --ink:#EDE5D9; --ink-2:#B5AA9C; --ink-3:#8B8072;
  --line:#3C352D; --line-2:#50473C;
  --brand:#9DB39C; --brand-ink:#B8CAB6; --brand-soft:#2F382E;
  --ok:#9DB39C; --ok-soft:#2F382E;
  --warn:#D6AF74; --warn-soft:#3E321E;
  --crit:#CE988D; --crit-soft:#3C2A25;
  --on-accent:#211D19;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -16px rgba(0,0,0,.75);
}

/* 页面内的主题开关，写在宿主 data-theme 之后，因此优先级更高 */
:root[data-ui-theme="light"]{
  --desk:#EAE3D8; --panel:#FAF6F0; --panel-2:#F2ECE2; --panel-3:#E6DDCF;
  --ink:#3B352F; --ink-2:#6F655B; --ink-3:#A0958A;
  --line:#DFD5C6; --line-2:#C9BCA8;
  --brand:#7E9080; --brand-ink:#5E6F60; --brand-soft:#E0E6DC;
  --ok:#7E9080; --ok-soft:#E0E6DC;
  --warn:#BF9455; --warn-soft:#F5E9D5;
  --crit:#B47B72; --crit-soft:#F2E1DC;
  --on-accent:#FAF6F0;
  --shadow:0 1px 2px rgba(78,64,48,.06), 0 10px 26px -16px rgba(78,64,48,.30);
}
:root[data-ui-theme="dark"]{
  --desk:#211D19; --panel:#2A2521; --panel-2:#332D27; --panel-3:#3D362E;
  --ink:#EDE5D9; --ink-2:#B5AA9C; --ink-3:#8B8072;
  --line:#3C352D; --line-2:#50473C;
  --brand:#9DB39C; --brand-ink:#B8CAB6; --brand-soft:#2F382E;
  --ok:#9DB39C; --ok-soft:#2F382E;
  --warn:#D6AF74; --warn-soft:#3E321E;
  --crit:#CE988D; --crit-soft:#3C2A25;
  --on-accent:#211D19;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -16px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%;
     background:linear-gradient(to right,var(--panel) 0 227px,var(--line) 227px 228px,var(--desk) 228px 100%)}
.rail{background:transparent;padding:18px 14px 24px;display:flex;flex-direction:column;gap:22px;
      position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100dvh;overflow:auto}
.stage{min-width:0;display:flex;flex-direction:column}
.content{padding:14px 18px 56px;display:flex;flex-direction:column;gap:12px;max-width:1680px;width:100%}
@media (min-width:1200px){ .content{padding-inline:32px} }

.brand{display:flex;align-items:baseline;gap:9px}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:20px;margin:0;letter-spacing:.02em}
.brand .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}

.rail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.rail-head h2{margin:0;font-size:10px;letter-spacing:.18em;color:var(--ink-3);font-family:var(--font-mono);font-weight:500;text-transform:uppercase}
.mini{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:2px 8px;font-size:11px;color:var(--ink-2);cursor:pointer;line-height:1.7}
.mini:hover{border-color:var(--line-2);color:var(--ink)}

.users{display:flex;flex-wrap:wrap;gap:7px}
.userchip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel-2);
          border-radius:999px;padding:3px 4px 3px 3px}
.userchip[data-on="true"]{background:var(--panel);border-color:transparent;
          box-shadow:inset 0 0 0 2px var(--u-color,var(--brand)), var(--shadow)}
.user{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;
      border-radius:999px;padding:2px 8px 2px 3px;cursor:pointer;font-weight:500;color:inherit}
.userchip[data-on="true"] .user{font-weight:700}
.user .dot{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.uedit{border:0;background:transparent;color:var(--ink-3);cursor:pointer;width:24px;height:24px;
       border-radius:999px;display:grid;place-items:center;flex:none}
.uedit:hover{background:var(--panel-3);color:var(--ink)}
.uedit svg{width:13px;height:13px}

.boards{display:flex;flex-direction:column;gap:2px}
.board-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;
           padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-weight:500}
.board-btn .ic{width:22px;text-align:center;font-size:15px;flex:none}
.board-btn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-btn .ct{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.board-btn:hover{background:var(--panel-2);color:var(--ink)}
.board-btn[aria-current="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.board-btn[aria-current="true"] .ct{color:var(--brand-ink)}
.board-btn.overview{border-bottom:1px solid var(--line);border-radius:9px 9px 0 0;margin-bottom:4px;padding-bottom:10px}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rail-foot p{margin:0;font-size:11px;color:var(--ink-3);line-height:1.7}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--desk) 88%,transparent);
        backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
@media (min-width:1200px){ .topbar{padding-inline:32px} }
.datenav{display:flex;align-items:center;gap:4px}
.nav-btn{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.nav-btn:hover{border-color:var(--line-2);color:var(--ink)}
.today-btn{height:30px;padding:0 11px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.today-btn:hover{border-color:var(--line-2);color:var(--ink)}
.bigdate{display:flex;align-items:baseline;gap:9px;min-width:0}
.bigdate .d{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.01em}
.bigdate .w{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.bigdate .rel{font-size:11px;color:var(--warn);background:var(--warn-soft);padding:1px 8px;border-radius:999px}
.topbar .spacer{flex:1}
.ring{display:flex;align-items:center;gap:10px}
.ring svg{display:block}
.ring .txt{font-family:var(--font-mono);font-size:15px;color:var(--ink-3);white-space:nowrap;
           font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ring .txt b{color:var(--ink);font-size:26px;font-weight:600;line-height:1}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.panel > header{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px solid var(--line)}
.panel > header h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em}
.panel > header .sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.panel > header .sp{flex:1}
.panel .body{padding:6px}
.panel .pad{padding:14px 16px}

.empty{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:13px}

/* 顶部细条：本周 + 提醒 */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);
       border:1px solid var(--line);border-radius:12px;padding:7px 10px}
.strip .sp{flex:1;min-width:0}
.strip .wk{display:flex;gap:3px;flex:none}
.strip .chips-inline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.strip .tally{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.strip .tally b{color:var(--ink)}
.daycell{display:flex;flex-direction:column;align-items:center;gap:1px;width:34px;flex:none;
         padding:4px 0 5px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer}
.daycell:hover{border-color:var(--line-2)}
.daycell .wd{font-family:var(--font-mono);font-size:9px;color:var(--ink-3);line-height:1.4}
.daycell .dd{font-family:var(--font-mono);font-size:13px;font-weight:600;line-height:1.3}
.daycell .meter{width:18px;height:3px;border-radius:999px;background:var(--panel-3);overflow:hidden;margin-top:2px}
.daycell .meter i{display:block;height:100%;background:var(--brand);border-radius:999px}
.daycell[data-today="1"] .dd{color:var(--brand)}
.daycell[aria-current="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.daycell.future{opacity:.5}
.rchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;
       background:var(--panel-2);border:1px solid var(--line)}
.rchip b{font-weight:700}
.rchip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.rchip.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.rchip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

/* 板块分列 */
.columns{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:12px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.col > header{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 12px;border-bottom:1px solid var(--line)}
.col > header .ic{font-size:15px;flex:none}
.col > header .nm{flex:1;min-width:0;border:0;background:transparent;padding:0;font:inherit;font-weight:700;
                  font-size:13px;color:inherit;text-align:left;cursor:pointer;
                  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col > header .nm:hover{color:var(--brand)}
.col > header .ct{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);flex:none}
.col .cards{padding:8px}
.col .colempty{padding:16px 10px;text-align:center;color:var(--ink-3);font-size:12px}
.col .colfoot{padding:0 8px 8px}
.col .colfoot input{width:100%;border:1px dashed var(--line-2);background:transparent;border-radius:9px;
                    padding:7px 10px;font-size:12px;color:var(--ink)}
.col .colfoot input:focus{border-style:solid;border-color:var(--brand);background:var(--panel-2);outline:none}
.col .colfoot input::placeholder{color:var(--ink-3)}
.seclab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);padding:9px 3px 5px}
.cards{display:flex;flex-direction:column;gap:8px}
.cards.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px;align-items:start}
.cards.grid.pad{padding:12px}
.columns.pad{padding:12px}

/* 所有事项：一行一条的表格 */
.rows{display:flex;flex-direction:column}
.rowhead,.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 14px}
.rowhead{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.13em;color:var(--ink-3);
         border-bottom:1px solid var(--line);padding-block:8px 7px}
.rowhead .ra{text-align:center}
.row{border-bottom:1px solid var(--line)}
.row:hover{background:var(--panel-2)}
.rowmeta{display:grid;grid-template-columns:118px 132px 148px;gap:10px;align-items:center}
.rowmeta .cell{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowmeta .cell.st{display:flex;align-items:center;gap:6px;white-space:nowrap}
.rowmeta .cell.mono{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.stname{font-size:11.5px;color:var(--ink-2)}
.row .ttl{font-size:13.5px}
.row.done .ttl,.row.done .ttl:hover{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.row.done{opacity:.6}
.row.done:hover{opacity:1}
.row.od .ttl{color:var(--crit)}
.ra{display:flex;gap:1px;align-items:center;flex:none}
.ra .iconbtn{width:26px;height:26px}
.rowsep{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.13em;color:var(--crit);
        background:var(--crit-soft);padding:5px 14px;border-bottom:1px solid var(--line)}
.rowdetail{display:flex;flex-direction:column;gap:7px;padding:2px 14px 11px 44px;
           border-bottom:1px solid var(--line);background:var(--panel-2)}
.more{padding:8px 14px;text-align:center;font-size:11.5px;color:var(--ink-3)}
.foldnote{padding:14px 16px;font-size:12.5px;color:var(--ink-3)}
@media (max-width:860px){
  .rowhead{display:none}
  .row{grid-template-columns:20px minmax(0,1fr) auto;row-gap:5px}
  .rowmeta{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:4px 10px}
  .rowmeta .cell{white-space:normal}
  .rowdetail{padding-left:14px}
}

/* 小方格 */
.card{border:1px solid var(--line);border-radius:11px;background:var(--panel-2);padding:9px 10px;
      display:flex;flex-direction:column;gap:6px}
.card.done{opacity:.6;background:transparent}
.card.done:hover{opacity:1}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-top .ttl{flex:1;min-width:0;font-size:13.5px;line-height:1.5;padding-top:1px}
.card.done .ttl,.card.done .ttl:hover{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.card-acts{display:flex;gap:0;flex:none;margin:-3px -5px 0 0}
.card .iconbtn{width:25px;height:25px}
.card-meta,.card .pipe,.card .desc{padding-left:29px}
.card-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.card .desc{font-size:11.5px;color:var(--ink-3);overflow-wrap:anywhere}
.card .note{margin-left:29px;width:calc(100% - 29px)}
.card .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}

.ttl{border:0;background:transparent;padding:0;margin:0;font:inherit;font-weight:500;text-align:left;
     cursor:pointer;color:inherit;overflow-wrap:anywhere}
.ttl:hover{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.iconbtn{border:1px solid transparent;background:transparent;color:var(--ink-3);cursor:pointer;
         width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none}
.iconbtn:hover{background:var(--panel-3);border-color:var(--line);color:var(--ink)}
.iconbtn.danger:hover{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.iconbtn svg{width:15px;height:15px}

.check{width:20px;height:20px;border:1.5px solid var(--line-2);border-radius:6px;background:transparent;
       display:grid;place-items:center;flex:none;cursor:pointer;color:transparent;transition:background .12s,border-color .12s}
.check:hover{border-color:var(--brand)}
.check[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--panel)}
.check svg{width:12px;height:12px}

.pipe{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.seg{border:1px solid var(--line);background:var(--panel);color:var(--ink-3);border-radius:999px;
     padding:2px 9px;font-size:11px;cursor:pointer;line-height:1.7;white-space:nowrap}
.seg:hover{border-color:var(--brand);color:var(--brand)}
.seg.past{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink)}
.seg.cur{background:var(--brand);border-color:var(--brand);color:var(--on-accent);font-weight:700}
.stagebar{display:flex;gap:3px;align-items:center;margin-right:2px;flex:none}
.stagebar i{width:10px;height:3px;border-radius:2px;background:var(--panel-3)}
.stagebar i.on{background:var(--brand)}

.note{display:block;border:1px dashed var(--line-2);background:transparent;border-radius:8px;
      padding:5px 8px;font-size:12px;color:var(--ink-2)}
.note:focus{border-style:solid;border-color:var(--brand);background:var(--panel);outline:none}
.note::placeholder{color:var(--ink-3)}

.due{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;
     padding:2px 8px;border-radius:999px;background:var(--panel-3);color:var(--ink-2)}
.due.warn{background:var(--warn-soft);color:var(--warn)}
.due.crit{background:var(--crit-soft);color:var(--crit)}
.due.ok{background:var(--ok-soft);color:var(--ok)}
.tagchip{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;color:var(--ink-3);
         border:1px solid var(--line);padding:1px 7px;border-radius:999px}

/* quick add */
.quick{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.quick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:8px 11px}
.quick input:focus{background:var(--panel);border-color:var(--brand);outline:none}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--on-accent);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink);border-color:var(--line-2)}
.btn.danger{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}

/* board header */
.boardhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.boardhead .ic{font-size:26px;line-height:1}
.boardhead h2{font-family:var(--font-display);margin:0;font-size:21px;font-weight:700}
.boardhead .sub{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.boardhead .sp{flex:1}

/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;
       width:min(560px,calc(100vw - 32px));box-shadow:0 24px 70px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(10,14,20,.5);backdrop-filter:blur(2px)}

<script>
(function(){
"use strict";

/* ============ 基础工具 ============ */
var $ = function(s,r){ return (r||document).querySelector(s); };
var WD = ["日","一","二","三","四","五","六"];
var PALETTE = ["#8593A8","#C09A9A","#8C9A88","#C2A36B","#9B8AA6","#7FA0A0","#B58A80","#9A9188"];
var STAGE_PRESETS = {
  "": [],
  "draft": ["大纲","初稿","作图","审核","发布"],
  "review": ["记录","分析","结论"]
};

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad(n){ return n<10?"0"+n:""+n; }
function toKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fromKey(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayKey(){ return toKey(new Date()); }
function addDays(k,n){ var d=fromKey(k); d.setDate(d.getDate()+n); return toKey(d); }
function mondayOf(k){ var d=fromKey(k); var w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return toKey(d); }
function diffDays(a,b){ return Math.round((fromKey(b)-fromKey(a))/86400000); }
function lastDayOf(monthKey){ var p=monthKey.split("-"); return new Date(+p[0], +p[1], 0).getDate(); }
function cnDate(k){ var d=fromKey(k); return (d.getMonth()+1)+"月"+d.getDate()+"日"; }
function uid(p){ return p+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-4); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ============ 初始示例（仅离线模式使用；联网数据由工作台自身保存） ============ */
var SEED_DAY = "2026-09-16";
var STARTER = {
  users:[
    {id:"u_shuaige", name:"帅哥", emoji:"🕶", color:"#8593A8", order:0},
    {id:"u_xiaozhu", name:"小猪", emoji:"🐷", color:"#C09A9A", order:1}
  ],
  boards:[
    {id:"b_xuexi",   userId:"u_shuaige", name:"学习",       icon:"📚", order:0},
    {id:"b_jiaoyi",  userId:"u_shuaige", name:"交易",       icon:"📈", order:1},
    {id:"b_zimeiti", userId:"u_shuaige", name:"自媒体",     icon:"🎬", order:2},
    {id:"b_shuiwu",  userId:"u_shuaige", name:"个体户税务", icon:"🧾", order:3},
    {id:"b_meimei",  userId:"u_xiaozhu", name:"美美",       icon:"✍️", order:0},
    {id:"b_tiandian",userId:"u_xiaozhu", name:"甜点",       icon:"🍰", order:1},
    {id:"b_richang", userId:"u_xiaozhu", name:"日常",       icon:"🌿", order:2}
  ],
  tasks:[
    {id:"t_jy1", userId:"u_shuaige", boardId:"b_jiaoyi",  title:"交易复盘",                  repeat:{kind:"daily"}, stages:[], note:"", order:0, start:SEED_DAY},
    {id:"t_zm1", userId:"u_shuaige", boardId:"b_zimeiti", title:"检查数据更新",              repeat:{kind:"daily"}, stages:[], note:"", order:1, start:SEED_DAY},
    {id:"t_zm2", userId:"u_shuaige", boardId:"b_zimeiti", title:"成交更新",                  repeat:{kind:"daily"}, stages:[], note:"", order:2, start:SEED_DAY},
    {id:"t_sw1", userId:"u_shuaige", boardId:"b_shuiwu",  title:"申报个人所得税（劳务报酬）", repeat:{kind:"monthly", day:15},    stages:[], note:"", order:3, start:SEED_DAY},
    {id:"t_sw2", userId:"u_shuaige", boardId:"b_shuiwu",  title:"支付劳务报酬",              repeat:{kind:"monthly", day:"end"}, stages:[], note:"", order:4, start:SEED_DAY},
    {id:"t_sw3", userId:"u_shuaige", boardId:"b_shuiwu",  title:"申报开票",                  repeat:{kind:"monthly", day:"end"}, stages:[], note:"", order:5, start:SEED_DAY},
    {id:"t_mm1", userId:"u_xiaozhu", boardId:"b_meimei",  title:"今日稿件",                  repeat:{kind:"daily"}, stages:["大纲","初稿","作图","审核","发布"], note:"", order:0, start:SEED_DAY}
  ]
};

/* ============ 状态 ============ */
var state = {
  users:[], boards:[], tasks:[], logs:{},
  userId:null, boardId:"all", dateKey: todayKey(),
  openNotes:{}, openRows:{}, foldAll:false, readOnly:false, ready:false, theme:"auto"
};
var DB=null, downloadsCap=null, localMode=false, toastTimer=null;
var logSubs = {};

/* ============ 本地缓存 ============ */
var LS_DATA="workbench.data.v1", LS_PREF="workbench.pref.v1", LS_THEME="workbench.theme.v1";
function applyTheme(v){
  var root = document.documentElement;
  if(v==="light" || v==="dark") root.setAttribute("data-ui-theme", v);
  else { v="auto"; root.removeAttribute("data-ui-theme"); }
  state.theme = v;
  try{ localStorage.setItem(LS_THEME, v); }catch(e){}
}
function loadTheme(){
  var v="auto";
  try{ v = localStorage.getItem(LS_THEME) || "auto"; }catch(e){}
  applyTheme(v);
}
function renderTheme(){
  var box = $("#themepick"); if(!box) return;
  Array.prototype.slice.call(box.querySelectorAll("button")).forEach(function(btn){
    btn.setAttribute("aria-pressed", String(btn.getAttribute("data-v")===state.theme));
  });
}
function persistLocal(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify({users:state.users,boards:state.boards,tasks:state.tasks,logs:state.logs})); }catch(e){}
}
function persistPref(){
  try{ localStorage.setItem(LS_PREF, JSON.stringify({userId:state.userId, boardId:state.boardId, foldAll:state.foldAll})); }catch(e){}
}
function loadPref(){
  try{ var p=JSON.parse(localStorage.getItem(LS_PREF)||"null");
        if(p){ state.userId=p.userId||null; state.boardId=p.boardId||"all"; state.foldAll=!!p.foldAll; } }catch(e){}
}
function loadLocal(){
  var d=null;
  try{ d=JSON.parse(localStorage.getItem(LS_DATA)||"null"); }catch(e){}
  if(d && d.users && d.users.length){ state.users=d.users; state.boards=d.boards||[]; state.tasks=d.tasks||[]; state.logs=d.logs||{}; }
  else { state.users=clone(STARTER.users); state.boards=clone(STARTER.boards); state.tasks=clone(STARTER.tasks); state.logs={}; persistLocal(); }
}

/* ============ 任务周期逻辑 ============ */
function startedBy(task, key){
  if(!task.start) return true;
  if(key >= task.start) return true;
  return key >= todayKey();           /* 今天及以后永远可见，避免时钟差异把事项藏起来 */
}
function inWindow(task, key){
  var r = task.repeat || {}, isMonth = (key.length===7);
  var f = r.from ? (isMonth ? r.from.slice(0,7) : r.from) : null;
  var to = r.to  ? (isMonth ? r.to.slice(0,7)   : r.to)   : null;
  if(f && key < f) return false;
  if(to && key > to) return false;
  return true;
}
function occursOn(task, key){
  if(!startedBy(task,key)) return false;
  if(!inWindow(task,key)) return false;
  var r = task.repeat || {kind:"daily"};
  if(r.kind==="daily") return true;
  if(r.kind==="weekly") return (r.days||[]).indexOf(fromKey(key).getDay()) >= 0;
  if(r.kind==="once") return r.date===key;
  if(r.kind==="dates") return (r.list||[]).indexOf(key) >= 0;
  return false;                        /* weekany / monthly 单独成区 */
}
/* 「重复 N 次」在保存时换算成一个结束日期，渲染时就不必再逐日数 */
function nthOccurrence(rep, from, n){
  if(rep.kind==="monthly"){
    var d0 = fromKey(from);
    return toKey(new Date(d0.getFullYear(), d0.getMonth()+n, 0));
  }
  var count = 0, d = from;
  for(var i=0;i<1200;i++){
    var hit = (rep.kind==="daily") ? true
            : (rep.kind==="weekly") ? ((rep.days||[]).indexOf(fromKey(d).getDay()) >= 0)
            : (rep.kind==="weekany") ? (fromKey(d).getDay()===1)
            : true;
    if(hit){ count++; if(count>=n) return d; }
    d = addDays(d,1);
  }
  return d;
}
function periodOf(task, key){
  var r = task.repeat || {kind:"daily"};
  if(r.kind==="monthly") return key.slice(0,7);
  if(r.kind==="weekany") return mondayOf(key);
  return key;
}
function monthlyPeriod(task, monthKey){
  /* 截止日早于该事项创建日时，本期不算数，顺延到下一个月 */
  if(startedBy(task, monthlyDue(task, monthKey))) return monthKey;
  return addDays(monthKey+"-28", 10).slice(0,7);
}
function monthlyDue(task, monthKey){
  var last = lastDayOf(monthKey);
  var day = (task.repeat.day==="end") ? last : Math.min(+task.repeat.day||1, last);
  return monthKey+"-"+pad(day);
}
function entryOf(task, pk){
  var doc = state.logs[task.userId+"_"+pk.slice(0,7)];
  return (doc && doc[task.id+"__"+pk]) || null;
}
function isDone(task, pk){
  var e = entryOf(task, pk); if(!e) return false;
  if(task.stages && task.stages.length) return (typeof e.s==="number") && e.s >= task.stages.length-1;
  return !!e.d;
}
function stageOf(task, pk){
  var e = entryOf(task, pk);
  return (e && typeof e.s==="number") ? e.s : -1;
}

/* ============ 选择与筛选 ============ */
function currentUser(){ var u=null; state.users.forEach(function(x){ if(x.id===state.userId) u=x; }); return u; }
function userBoards(){
  return state.boards.filter(function(b){ return b.userId===state.userId; })
                     .sort(function(a,b){ return (a.order||0)-(b.order||0); });
}
function scopeTasks(){
  return state.tasks.filter(function(t){
    if(t.userId!==state.userId || t.archived) return false;
    if(state.boardId!=="all" && t.boardId!==state.boardId) return false;
    return true;
  }).sort(function(a,b){ return (a.order||0)-(b.order||0); });
}
function boardOf(id){ var r=null; state.boards.forEach(function(b){ if(b.id===id) r=b; }); return r; }
function taskOf(id){ var r=null; state.tasks.forEach(function(t){ if(t.id===id) r=t; }); return r; }

/* 未完成在前、已完成沉底；sort 是稳定的，组内原有顺序保持不变 */
function sinkDone(items){
  return items.slice().sort(function(a,b){
    return (isDone(a.task,a.pk)?1:0) - (isDone(b.task,b.pk)?1:0);
  });
}
function dayStats(tasks, key){
  var total=0, done=0;
  tasks.forEach(function(t){ if(occursOn(t,key)){ total++; if(isDone(t,key)) done++; } });
  return {total:total, done:done};
}
function streakOf(tasks){
  var n=0, cur=todayKey(), s=dayStats(tasks,cur);
  if(!(s.total>0 && s.done===s.total)) cur=addDays(cur,-1);
  for(var i=0;i<60;i++){
    var d=dayStats(tasks,cur);
    if(d.total===0){ cur=addDays(cur,-1); continue; }
    if(d.done===d.total){ n++; cur=addDays(cur,-1); } else break;
  }
  return n;
}
function overdueList(tasks){
  var out=[], today=todayKey();
  for(var i=14;i>=1;i--){
    var k=addDays(today,-i);
    tasks.forEach(function(t){ if(occursOn(t,k) && !isDone(t,k)) out.push({task:t, pk:k}); });
  }
  tasks.forEach(function(t){
    if(t.repeat && t.repeat.kind==="monthly"){
      var m=monthlyPeriod(t, today.slice(0,7));
      if(m===today.slice(0,7) && inWindow(t,m)){
        var due=monthlyDue(t,m);
        if(today>due && !isDone(t,m)) out.push({task:t, pk:m, due:due});
      }
    }
    if(t.repeat && t.repeat.kind==="weekany"){
      var prev=addDays(mondayOf(today),-7);
      if(startedBy(t,prev) && inWindow(t,prev) && !isDone(t,prev)) out.push({task:t, pk:prev});
    }
  });
  return out;
}

/* ============ 写入 ============ */
function toast(msg){
  var old=$(".toast"); if(old) old.remove();
  var n=document.createElement("div"); n.className="toast"; n.textContent=msg; document.body.appendChild(n);
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ n.remove(); }, 2600);
}
function setNote(txt){ var n=$("#storeNote"); if(n) n.textContent=txt; }
function onWriteFail(e){
  var code = e && e.code;
  if(code==="invalid_argument"){ state.readOnly=true; setNote("只读访问 · 改动无法保存"); toast("当前账号没有写入权限，改动未保存"); }
  else if(code==="quota_exceeded"){ toast("存储条目已满，请删除一些旧数据"); }
  else if(code==="revoked"){ state.readOnly=true; toast("访问权限已变更，请刷新页面"); }
  else { toast("保存失败，请稍后重试"); }
  render();
}
function saveCfg(key){
  persistLocal();
  render();
  if(!DB) return Promise.resolve();
  var body={}; body.list=state[key]; body.updatedAt=Date.now();
  return DB.doc("config/"+key).set(body).catch(onWriteFail);
}
function saveEntry(task, pk, patch){
  var docId = task.userId+"_"+pk.slice(0,7), key = task.id+"__"+pk;
  var doc = state.logs[docId] || (state.logs[docId]={});
  var next = {}; var prev = doc[key]||{};
  Object.keys(prev).forEach(function(k){ next[k]=prev[k]; });
  Object.keys(patch).forEach(function(k){ next[k]=patch[k]; });
  doc[key]=next;
  persistLocal(); render();
  if(!DB) return;
  var payload={entries:{}}; payload.entries[key]=next;
  var ref = DB.doc("logs/"+docId);
  ref.update(payload).catch(function(){
    return ref.set({userId:task.userId, month:pk.slice(0,7), entries: state.logs[docId]});
  }).catch(onWriteFail);
}

/* ============ 渲染：左侧导轨 ============ */
function renderRail(){
  var u=$("#users");
  u.innerHTML = state.users.map(function(x){
    var on = x.id===state.userId;
    return '<span class="userchip" data-on="'+on+'" style="--u-color:'+esc(x.color)+'">'
      + '<button class="user" type="button" data-act="user" data-id="'+esc(x.id)+'" aria-pressed="'+on+'">'
      + '<span class="dot" style="background:'+esc(x.color)+'">'+esc(x.emoji||"●")+'</span>'+esc(x.name)+'</button>'
      + (on ? '<button class="uedit" type="button" data-act="edit-user" data-id="'+esc(x.id)+'"'
              + ' title="编辑用户：改名 / 换图标 / 换配色" aria-label="编辑用户「'+esc(x.name)+'」">'+ICON_EDIT+'</button>' : '')
      + '</span>';
  }).join("") || '<p class="hint">还没有用户，点「＋ 新用户」开始。</p>';

  var today = todayKey();
  var mine = state.tasks.filter(function(t){ return t.userId===state.userId && !t.archived; });
  var allI = allItemsFor(mine, state.dateKey);
  var html = '<button class="board-btn overview" type="button" data-act="board" data-id="all" aria-current="'+(state.boardId==="all")+'">'
    + '<span class="ic">◎</span><span class="nm">总览</span>'
    + '<span class="ct mono">'+doneCount(allI)+"/"+allI.length+'</span></button>';
  html += userBoards().map(function(b){
    var ts = mine.filter(function(t){ return t.boardId===b.id; });
    var s = dayStats(ts, today), ct;
    if(s.total){ ct = s.done+"/"+s.total; }
    else {
      var open = 0, wk = mondayOf(today);
      ts.forEach(function(t){
        var kind = (t.repeat||{}).kind;
        if(kind==="monthly" && startedBy(t,today) && !isDone(t, monthlyPeriod(t, today.slice(0,7)))) open++;
        if(kind==="weekany" && startedBy(t,wk) && !isDone(t,wk)) open++;
      });
      ct = open ? "待办 "+open : "—";
    }
    return '<button class="board-btn" type="button" data-act="board" data-id="'+esc(b.id)+'" aria-current="'+(state.boardId===b.id)+'">'
      + '<span class="ic">'+esc(b.icon||"▪")+'</span><span class="nm">'+esc(b.name)+'</span>'
      + '<span class="ct mono">'+ct+'</span></button>';
  }).join("");
  $("#boards").innerHTML = html;
}

/* ============ 渲染：顶栏 ============ */
function ringSVG(pct){
  var r=18, c=2*Math.PI*r, off=c*(1-pct);
  return '<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">'
    + '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="var(--panel-3)" stroke-width="5"></circle>'
    + '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="var(--brand)" stroke-width="5" stroke-linecap="round"'
    + ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 22 22)"></circle></svg>';
}
function renderTopbar(){
  var k=state.dateKey, d=fromKey(k), today=todayKey(), delta=diffDays(today,k);
  var rel = delta===0 ? "今天" : delta===1 ? "明天" : delta===-1 ? "昨天" : (delta>0 ? delta+"天后" : (-delta)+"天前");
  var items = allItemsFor(scopeTasks(), k);
  var s = {done: doneCount(items), total: items.length};
  var pct = s.total ? s.done/s.total : 0;
  $("#topbar").innerHTML =
    '<div class="datenav">'
    + '<button class="nav-btn" type="button" data-act="day" data-n="-1" aria-label="前一天">‹</button>'
    + '<button class="nav-btn" type="button" data-act="day" data-n="1" aria-label="后一天">›</button>'
    + '<button class="today-btn" type="button" data-act="today">今天</button></div>'
    + '<div class="bigdate"><span class="d">'+(d.getMonth()+1)+'月'+d.getDate()+'日</span>'
    + '<span class="w mono">周'+WD[d.getDay()]+' · '+k+'</span>'
    + (delta===0 ? '' : '<span class="rel">'+rel+'</span>')
    + '</div><div class="spacer"></div>'
    + '<div class="ring">'+ringSVG(pct)+'<span class="txt"><b>'+s.done+'</b> / '+s.total+'</span></div>'
    + '<button class="btn" type="button" data-act="add-task">＋ 添加事项</button>';
}

/* ============ 渲染：任务卡片 ============ */
var ICON_NOTE = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 3.5h11M2.5 7h11M2.5 10.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
var ICON_EDIT = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.1 2.4l2.5 2.5M2.5 11l8-8 2.5 2.5-8 8-3.2.7.7-3.2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
var ICON_TRASH = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.8 4.3h10.4M6.4 4.3V2.9h3.2v1.4M4.2 4.3l.6 8.3h6.4l.6-8.3M6.6 6.6v3.8M9.4 6.6v3.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function dueChip(task, monthKey){
  var due = monthlyDue(task, monthKey), today=todayKey(), left = diffDays(today, due);
  if(isDone(task, monthKey)) return '<span class="due ok">已完成</span>';
  if(left<0)  return '<span class="due crit">逾期 '+(-left)+' 天</span>';
  if(left===0) return '<span class="due crit">今天截止</span>';
  if(left<=3) return '<span class="due warn">还有 '+left+' 天 · '+cnDate(due)+'</span>';
  return '<span class="due">还有 '+left+' 天 · '+cnDate(due)+'</span>';
}
function repeatLabel(t){
  var r=t.repeat||{kind:"daily"}, base="";
  if(r.kind==="daily") base="每天";
  else if(r.kind==="weekly") base="每周"+(r.days||[]).map(function(d){ return WD[d]; }).join("·");
  else if(r.kind==="weekany") base="每周内";
  else if(r.kind==="monthly") base = (r.day==="end") ? "每月底前" : "每月"+r.day+"号前";
  else if(r.kind==="once") return "单次";
  else if(r.kind==="dates") return "自定义 "+((r.list||[]).length)+" 天";
  if(r.times) return base+" · 共"+r.times+"次";
  if(r.to) return base+" · 至"+cnDate(r.to);
  return base;
}

function taskCard(task, pk, opts){
  opts = opts || {};
  var staged = !!(task.stages && task.stages.length);
  var done = isDone(task, pk);
  var e = entryOf(task, pk);
  var st = stageOf(task, pk);
  if(staged) st = Math.min(st, task.stages.length-1);
  var noteKey = task.id+"__"+pk;
  var noteId = (opts.ns||"")+noteKey;
  var showNote = staged || state.openNotes[noteKey] || (e && e.n);

  var h = '<div class="card'+(done?" done":"")+'">';
  h += '<div class="card-top">';
  h += '<button class="check" type="button" data-act="toggle" data-id="'+esc(task.id)+'" data-pk="'+esc(pk)+'"'
     + ' aria-pressed="'+done+'" aria-label="'+(done?"取消完成":"标记完成")+'：'+esc(task.title)+'">'+CHECK_SVG+'</button>';
  h += '<button class="ttl" type="button" data-act="edit-task" data-id="'+esc(task.id)+'"'
     + ' title="点击重命名 / 编辑">'+esc(task.title)+'</button>';
  h += '<span class="card-acts">';
  if(!staged && !opts.compact) h += '<button class="iconbtn" type="button" data-act="note" data-id="'+esc(task.id)+'" data-pk="'+esc(pk)+'"'
     + ' data-nid="'+esc(noteId)+'" title="当期备注" aria-label="给「'+esc(task.title)+'」写备注">'+ICON_NOTE+'</button>';
  h += '<button class="iconbtn" type="button" data-act="edit-task" data-id="'+esc(task.id)+'"'
     + ' title="重命名 / 编辑" aria-label="编辑「'+esc(task.title)+'」">'+ICON_EDIT+'</button>';
  h += '<button class="iconbtn danger" type="button" data-act="del-task" data-id="'+esc(task.id)+'"'
     + ' title="删除事项" aria-label="删除「'+esc(task.title)+'」">'+ICON_TRASH+'</button>';
  h += '</span></div>';

  var meta = [];
  if(opts.dueMonth) meta.push(dueChip(task, pk));
  if(opts.showRepeat) meta.push('<span class="tagchip">'+esc(repeatLabel(task))+'</span>');
  if(opts.boardTag){ var bd=boardOf(task.boardId); if(bd) meta.push('<span class="tagchip">'+esc((bd.icon||"")+" "+bd.name)+'</span>'); }
  if(opts.dayLabel) meta.push('<span class="meta">'+cnDate(pk)+' 周'+WD[fromKey(pk).getDay()]+'</span>');
  if(done && e && e.t && !opts.dueMonth) meta.push('<span class="meta">✓ '+new Date(e.t).toTimeString().slice(0,5)+'</span>');
  if(meta.length) h += '<div class="card-meta">'+meta.join("")+'</div>';

  if(staged && opts.compact){
    h += '<div class="pipe"><span class="stagebar" aria-hidden="true">'
       + task.stages.map(function(_,i){ return '<i class="'+(i<=st?"on":"")+'"></i>'; }).join("")
       + '</span><span class="meta">'+(st>=0?esc(task.stages[st]):"未开始")+'</span></div>';
  } else if(staged){
    var bars='';
    for(var i=0;i<task.stages.length;i++) bars += '<i class="'+(i<=st?"on":"")+'"></i>';
    h += '<div class="pipe"><span class="stagebar" aria-hidden="true">'+bars+'</span>';
    h += task.stages.map(function(name,i){
      var cls = i<st ? "past" : (i===st ? "cur"+(i===task.stages.length-1?" final":"") : "");
      return '<button class="seg '+cls+'" type="button" data-act="stage" data-id="'+esc(task.id)+'" data-pk="'+esc(pk)+'" data-i="'+i+'"'
        + ' title="标记到「'+esc(name)+'」'+(i===st?"（再点一次退回上一步）":"")+'">'+esc(name)+'</button>';
    }).join("");
    h += '</div>';
  } else if(task.note && !opts.compact){
    h += '<div class="desc">'+esc(task.note)+'</div>';
  }
  if(showNote && !opts.compact){
    h += '<input class="note" type="text" id="note-'+esc(noteId)+'" data-note="'+esc(task.id)+'" data-pk="'+esc(pk)+'"'
       + ' value="'+esc(e&&e.n?e.n:"")+'" placeholder="'+(staged?"今天的主题 / 备注…":"备注…")+'">';
  }
  h += '</div>';
  return h;
}

/* ============ 渲染：正文 ============ */
function panel(title, sub, bodyHTML, headExtra){
  return '<section class="panel"><header><h3>'+title+'</h3>'
    + (sub?'<span class="sub mono">'+sub+'</span>':'')+'<span class="sp"></span>'
    + (headExtra||"")+'</header>'+bodyHTML+'</section>';
}

/* 一个板块在当前日期下的几组事项；待补只在看「今天」时并进来 */
function bucketsFor(tasks, key){
  var wk = mondayOf(key), mk = key.slice(0,7);
  return {
    day:   sinkDone(tasks.filter(function(t){ return occursOn(t,key); })
                         .map(function(t){ return {task:t, pk:key}; })),
    week:  sinkDone(tasks.filter(function(t){ return (t.repeat||{}).kind==="weekany" && startedBy(t,key) && inWindow(t,key); })
                         .map(function(t){ return {task:t, pk:wk}; })),
    month: sinkDone(tasks.filter(function(t){ return (t.repeat||{}).kind==="monthly" && startedBy(t,key) && inWindow(t,mk); })
                         .map(function(t){ return {task:t, pk:monthlyPeriod(t, mk)}; })
                         .sort(function(a,b){ return monthlyDue(a.task,a.pk) < monthlyDue(b.task,b.pk) ? -1 : 1; })),
    overdue: (key===todayKey()) ? overdueList(tasks) : []
  };
}
function bucketCards(bk){
  var h = "";
  h += bk.day.map(function(it){ return taskCard(it.task, it.pk, {showRepeat:true}); }).join("");
  if(bk.week.length){
    h += '<div class="seclab">本周内</div>';
    h += bk.week.map(function(it){ return taskCard(it.task, it.pk, {}); }).join("");
  }
  if(bk.month.length){
    h += '<div class="seclab">本月截止</div>';
    h += bk.month.map(function(it){ return taskCard(it.task, it.pk, {dueMonth:true}); }).join("");
  }
  if(bk.overdue.length){
    var shown = bk.overdue.slice(0,5);
    h += '<div class="seclab">待补</div>';
    h += shown.map(function(it){
      return taskCard(it.task, it.pk, {ns:"od-", compact:true, dayLabel:(it.pk.length>7), dueMonth:(it.pk.length===7)});
    }).join("");
    if(bk.overdue.length>shown.length) h += '<div class="more">还有 '+(bk.overdue.length-shown.length)+' 条更早的</div>';
  }
  return h;
}

/* 当天全部要做的：日常 + 本周内 + 本月截止，合成一条平铺的清单 */
function allItemsFor(tasks, key){
  var bk = bucketsFor(tasks, key);
  return sinkDone(bk.day.concat(bk.week, bk.month));
}
function doneCount(items){
  return items.filter(function(it){ return isDone(it.task, it.pk); }).length;
}

/* ---- 表格行（所有事项用，一行一条，可展开） ---- */
function rowHead(){
  return '<div class="rowhead"><span></span><span>事项</span>'
    + '<span class="rowmeta"><span>板块</span><span>周期</span><span>状态</span></span>'
    + '<span class="ra">操作</span></div>';
}
function taskRow(task, pk, opts){
  opts = opts || {};
  var staged = !!(task.stages && task.stages.length);
  var done = isDone(task, pk);
  var e = entryOf(task, pk);
  var st = stageOf(task, pk);
  if(staged) st = Math.min(st, task.stages.length-1);
  var rk = task.id+"__"+pk;
  var open = !!state.openRows[rk];
  var bd = boardOf(task.boardId);

  var status;
  if(opts.dueMonth) status = dueChip(task, pk);
  else if(staged){
    var bars = task.stages.map(function(_,i){ return '<i class="'+(i<=st?"on":"")+'"></i>'; }).join("");
    status = '<span class="stagebar" aria-hidden="true">'+bars+'</span>'
           + '<span class="stname">'+(st>=0?esc(task.stages[st]):"未开始")+'</span>';
  }
  else status = done ? '<span class="due ok">已完成</span>' : '<span class="meta">待办</span>';

  var h = '<div class="row'+(done?" done":"")+(opts.overdue?" od":"")+'">';
  h += '<button class="check" type="button" data-act="toggle" data-id="'+esc(task.id)+'" data-pk="'+esc(pk)+'"'
     + ' aria-pressed="'+done+'" aria-label="'+(done?"取消完成":"标记完成")+'：'+esc(task.title)+'">'+CHECK_SVG+'</button>';
  h += '<button class="ttl" type="button" data-act="edit-task" data-id="'+esc(task.id)+'" title="点击重命名 / 编辑">'
     + esc(task.title)+'</button>';
  h += '<span class="rowmeta">'
     + '<span class="cell">'+(bd?esc((bd.icon||"")+" "+bd.name):"")+'</span>'
     + '<span class="cell mono">'+(opts.overdue ? cnDate(pk)+' 周'+WD[fromKey(pk).getDay()] : esc(repeatLabel(task)))+'</span>'
     + '<span class="cell st">'+status+'</span></span>';
  h += '<span class="ra">'
     + '<button class="iconbtn" type="button" data-act="row" data-rk="'+esc(rk)+'" aria-expanded="'+open+'"'
     + ' title="'+(open?"收起":"展开：状态与备注")+'" aria-label="'+(open?"收起":"展开")+'「'+esc(task.title)+'」">'
     + (open?"▾":"▸")+'</button>'
     + '<button class="iconbtn" type="button" data-act="edit-task" data-id="'+esc(task.id)+'"'
     + ' title="重命名 / 编辑" aria-label="编辑「'+esc(task.title)+'」">'+ICON_EDIT+'</button>'
     + '<button class="iconbtn danger" type="button" data-act="del-task" data-id="'+esc(task.id)+'"'
     + ' title="删除事项" aria-label="删除「'+esc(task.title)+'」">'+ICON_TRASH+'</button>'
     + '</span></div>';

  if(open){
    h += '<div class="rowdetail">';
    if(staged){
      h += '<div class="pipe">' + task.stages.map(function(name,i){
        var cls = i<st ? "past" : (i===st ? "cur"+(i===task.stages.length-1?" final":"") : "");
        return '<button class="seg '+cls+'" type="button" data-act="stage" data-id="'+esc(task.id)+'" data-pk="'+esc(pk)+'" data-i="'+i+'"'
          + ' title="标记到「'+esc(name)+'」'+(i===st?"（再点一次退回上一步）":"")+'">'+esc(name)+'</button>';
      }).join("") + '</div>';
    }
    if(task.note) h += '<div class="desc">'+esc(task.note)+'</div>';
    h += '<input class="note" type="text" id="note-tbl-'+esc(rk)+'" data-note="'+esc(task.id)+'" data-pk="'+esc(pk)+'"'
       + ' value="'+esc(e&&e.n?e.n:"")+'" placeholder="'+(staged?"今天的主题 / 备注…":"备注…")+'">';
    h += '</div>';
  }
  return h;
}

function renderContent(){
  var c = $("#content");
  if(!state.users.length){
    c.innerHTML = '<section class="panel"><div class="empty">还没有用户。<br><br>'
      + '<button class="btn" type="button" data-act="add-user">创建第一个用户</button></div></section>';
    return;
  }
  var key = state.dateKey, today = todayKey();
  var tasks = scopeTasks();
  var board = state.boardId==="all" ? null : boardOf(state.boardId);
  var out = "";

  /* — 细条：提醒 + 本周 — */
  var bkAll = bucketsFor(tasks, key);
  var pending = bkAll.day.filter(function(it){ return !isDone(it.task, it.pk); });
  var soon = [];
  bkAll.month.forEach(function(it){
    if(isDone(it.task, it.pk)) return;
    var left = diffDays(today, monthlyDue(it.task, it.pk));
    if(left<=5) soon.push({task:it.task, left:left});
  });
  var overdue = bkAll.overdue;
  var chips = [];
  if(pending.length) chips.push('<span class="rchip warn">待办 <b>'+pending.length+'</b></span>');
  soon.forEach(function(it){
    chips.push('<span class="rchip '+(it.left<=1?"crit":"warn")+'">'+esc(it.task.title)+' · '
      + (it.left<0 ? "逾期"+(-it.left)+"天" : (it.left===0 ? "今天截止" : it.left+"天后"))+'</span>');
  });
  if(overdue.length) chips.push('<span class="rchip crit">待补 <b>'+overdue.length+'</b></span>');
  if(!chips.length) chips.push('<span class="rchip ok">今天的事都做完了</span>');

  var wkStart = mondayOf(key), wkDone=0, wkTotal=0, cells="";
  for(var j=0;j<7;j++){
    var dk = addDays(wkStart,j), st2 = dayStats(tasks,dk), p = st2.total? st2.done/st2.total : 0;
    wkDone += st2.done; wkTotal += st2.total;
    cells += '<button class="daycell'+(dk>today?" future":"")+'" type="button" data-act="jump" data-date="'+dk+'"'
      + ' aria-current="'+(dk===key)+'" data-today="'+(dk===today?1:0)+'" aria-label="'+cnDate(dk)+'">'
      + '<span class="wd">'+WD[fromKey(dk).getDay()]+'</span><span class="dd">'+fromKey(dk).getDate()+'</span>'
      + '<span class="meter"><i style="width:'+Math.round(p*100)+'%"></i></span></button>';
  }
  out += '<div class="strip">'
    + '<div class="wk">'+cells+'</div>'
    + '<div class="chips-inline">'+chips.join("")+'</div>'
    + '<span class="sp"></span>'
    + '<span class="tally mono">本周 <b>'+wkDone+'</b>/'+wkTotal+' · 连续 <b>'+streakOf(tasks)+'</b> 天</span>'
    + '</div>';

  /* — 总览顶部：所有事项，一行一条的表格，待补并入其中 — */
  if(!board){
    var allItems = sinkDone(bkAll.day.concat(bkAll.week, bkAll.month));
    var allDone = doneCount(allItems);
    var fold = state.foldAll;
    var head = '<button class="mini" type="button" data-act="fold" aria-expanded="'+(!fold)+'">'
             + (fold ? "展开 ▾" : "缩起 ▴")+'</button>'
             + '<button class="btn ghost" type="button" data-act="add-task">＋ 添加事项</button>';
    var body;
    if(fold){
      body = '<div class="foldnote">已缩起 · '+allDone+' / '+allItems.length+' 完成'
           + (overdue.length ? ' · 另有 '+overdue.length+' 条待补' : '')+'</div>';
    } else if(!allItems.length && !overdue.length){
      body = '<div class="empty">'+cnDate(key)+'没有任何事项。用上面的「＋ 添加事项」排一件。</div>';
    } else {
      var odShown = overdue.slice(0,20);
      body = '<div class="rows">' + rowHead()
        + allItems.map(function(it){
            return taskRow(it.task, it.pk, {dueMonth:(it.pk.length===7)});
          }).join("")
        + (overdue.length
            ? '<div class="rowsep">待补 · 近 14 天未完成</div>'
              + odShown.map(function(it){
                  return taskRow(it.task, it.pk, {overdue:true, dueMonth:(it.pk.length===7)});
                }).join("")
              + (overdue.length>odShown.length ? '<div class="more">还有 '+(overdue.length-odShown.length)+' 条更早的</div>' : '')
            : '')
        + '</div>';
    }
    out += panel("所有事项", allDone+" / "+allItems.length, body, head);
  }

  /* — 主区：总览按板块分列；单个板块则铺成卡片格 — */
  if(board){
    var bk = bucketsFor(tasks, key);
    var bodyCards = bucketCards(bk);
    out += '<div class="boardhead"><span class="ic">'+esc(board.icon||"▪")+'</span>'
      + '<h2>'+esc(board.name)+'</h2>'
      + '<span class="sub">'+tasks.length+' 个事项</span><span class="sp"></span>'
      + '<button class="btn ghost" type="button" data-act="edit-board" data-id="'+esc(board.id)+'">板块设置</button>'
      + '<button class="btn" type="button" data-act="add-task" data-board="'+esc(board.id)+'">＋ 新建事项</button></div>';
    out += bodyCards
      ? '<div class="cards grid">'+bodyCards+'</div>'
      : '<section class="panel"><div class="empty">「'+esc(board.name)+'」在 '+cnDate(key)+' 没有事项。<br><br>'
        + '<button class="btn" type="button" data-act="add-task" data-board="'+esc(board.id)+'">＋ 新建事项</button></div></section>';
    out += quickRow(board.id, board.name);
  } else {
    var boards = userBoards();
    if(!boards.length){
      out += '<section class="panel"><div class="empty">还没有板块。<br><br>'
        + '<button class="btn" type="button" data-act="add-board">创建第一个板块</button></div></section>';
    } else {
      out += '<div class="columns">' + boards.map(function(b){
        var bt = tasks.filter(function(t){ return t.boardId===b.id; });
        var bk2 = bucketsFor(bt, key);
        var cards = bucketCards(bk2);
        var dn = bk2.day.filter(function(it){ return isDone(it.task,it.pk); }).length;
        var h = '<section class="col"><header>'
          + '<span class="ic">'+esc(b.icon||"▪")+'</span>'
          + '<button class="nm" type="button" data-act="board" data-id="'+esc(b.id)+'" title="只看「'+esc(b.name)+'」">'+esc(b.name)+'</button>'

    ? {id:a.id, val:a.value, s:a.selectionStart, e:a.selectionEnd} : null;

function askConfirm(opt, onYes){

  cdlg.querySelector("[data-no]").addEventListener("click", function(){ cdlg.close(); });
  cdlg.querySelector("[data-yes]").addEventListener("click", function(){ cdlg.close(); onYes(); });
  cdlg.showModal();

  dlg.innerHTML = '<form id="dlgForm" novalidate>'
    + '<div class="dh"><h3>'+opt.title+'</h3></div>'
    + '<div class="db">'+opt.body+'</div>'
    + '<div class="df">'+(opt.footerLeft||"")+'<span class="sp"></span>'

    + '<button class="btn" type="submit">'+(opt.submitLabel||"保存")+'</button></div></form>';
  dlg.querySelector("[data-close]").addEventListener("click", function(){ dlg.close(); });
  dlg.querySelector("#dlgForm").addEventListener("submit", function(ev){
    ev.preventDefault();

/* ============ 交互 ============ */
document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!b) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), pk = b.getAttribute("data-pk");
  if(act==="user"){ if(state.userId!==id){ state.userId=id; state.boardId="all"; persistPref(); syncLogSubs(); render(); } return; }
  if(act==="board"){ state.boardId=id; persistPref(); render(); window.scrollTo({top:0, behavior:"smooth"}); return; }
  if(act==="add-user"){ openUserDialog(null); return; }
  if(act==="edit-user"){ openUserDialog(id); return; }
  if(act==="add-board"){ openBoardDialog(null); return; }
  if(act==="edit-board"){ openBoardDialog(id); return; }
  if(act==="add-task"){ openTaskDialog(null, b.getAttribute("data-board")); return; }
  if(act==="edit-task"){ openTaskDialog(id); return; }
  if(act==="day"){ state.dateKey = addDays(state.dateKey, Number(b.getAttribute("data-n"))); syncLogSubs(); render(); return; }
  if(act==="today"){ state.dateKey = todayKey(); syncLogSubs(); render(); return; }
  if(act==="jump"){ state.dateKey = b.getAttribute("data-date"); syncLogSubs(); render(); return; }
  if(act==="export"){ doExport(); return; }
  if(act==="theme"){ applyTheme(b.getAttribute("data-v")); render(); return; }
  if(act==="fold"){ state.foldAll = !state.foldAll; persistPref(); render(); return; }
  if(act==="row"){
    var rk = b.getAttribute("data-rk");
    if(state.openRows[rk]) delete state.openRows[rk]; else state.openRows[rk]=1;
    render();
    var fi = document.getElementById("note-tbl-"+rk); if(fi) fi.focus();
    return;
  }
  if(act==="del-task"){
    var dt = taskOf(id); if(!dt) return;
    askConfirm({
      title:"删除事项",
      body:"确定删除「"+esc(dt.title)+"」？<br><span class=\"hint\">历史打卡记录会保留，但这条事项不再出现。</span>"
    }, function(){
      state.tasks = state.tasks.filter(function(x){ return x.id!==id; });
      saveCfg("tasks"); toast("已删除「"+dt.title+"」");
    });
    return;
  }
  if(act==="note"){
    var nk = id+"__"+pk, nid = b.getAttribute("data-nid") || nk;
    if(state.openNotes[nk]) delete state.openNotes[nk]; else state.openNotes[nk]=1;
    render();
    var f = document.getElementById("note-"+nid); if(f) f.focus();
    return;
  }
  if(act==="toggle"){
    var t = taskOf(id); if(!t) return;
    var done = isDone(t, pk);
    var last = (t.stages && t.stages.length) ? t.stages.length-1 : -1;
    saveEntry(t, pk, done ? {d:false, s:-1, t:Date.now()} : {d:true, s:last, t:Date.now()});
    return;
  }
  if(act==="stage"){
    var t2 = taskOf(id); if(!t2) return;
    var i = Number(b.getAttribute("data-i")), cur = stageOf(t2, pk);
    var next = (cur===i) ? i-1 : i;
    saveEntry(t2, pk, {s:next, d:(next >= t2.stages.length-1), t:Date.now()});
    return;
  }
  if(act==="quick"){ quickAdd(b.getAttribute("data-board")); return; }
});
document.addEventListener("keydown", function(ev){
  var q = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-quick");
  if(ev.key==="Enter" && q){ ev.preventDefault(); quickAdd(q); }
});
document.addEventListener("change", function(ev){
  var n = ev.target;
  if(n && n.hasAttribute && n.hasAttribute("data-note")){
    var t = taskOf(n.getAttribute("data-note"));
    if(t) saveEntry(t, n.getAttribute("data-pk"), {n:n.value.trim()});
  }
});
function quickAdd(boardId){
  var boards = userBoards();
  if(!boards.length){ toast("请先创建一个板块"); openBoardDialog(null); return; }
  var bId = boardId || ((state.boardId!=="all") ? state.boardId : boards[0].id);
  var inp = document.getElementById("quick-"+bId); if(!inp) return;
  var v = inp.value.trim(); if(!v) return;
  state.tasks.push({id:uid("t_"), userId:state.userId, boardId:bId, title:v,
                    repeat:{kind:"once", date:state.dateKey}, stages:[], note:"",
                    order:state.tasks.length, start:state.dateKey});
  inp.value = "";
  saveCfg("tasks");
  toast("已添加到 "+cnDate(state.dateKey));
}

/* ============ 导出备份 ============ */
function doExport(){
  if(!downloadsCap){ toast("当前环境不支持导出"); return; }
  var payload = JSON.stringify({
    exportedAt:new Date().toISOString(), version:1,
    users:state.users, boards:state.boards, tasks:state.tasks, logs:state.logs
  }, null, 2);
  downloadsCap.save({ filename:"工作台备份-"+todayKey()+".json", data:payload })
    .then(function(){ toast("备份已保存"); })
    .catch(function(){ toast("未保存备份"); });
}

/* ============ 数据连接 ============ */
function normalizeSelection(){
  var ids = state.users.map(function(u){ return u.id; });
  if(!state.userId || ids.indexOf(state.userId)<0) state.userId = ids.length ? ids[0] : null;
  if(state.boardId!=="all"){
    var b = boardOf(state.boardId);
    if(!b || b.userId!==state.userId) state.boardId = "all";
  }
}
function neededDocIds(){
  if(!state.userId) return [];
  var months = {}, t = todayKey();
  [state.dateKey, addDays(state.dateKey,-32), addDays(state.dateKey,32), t, addDays(t,-32)]
    .forEach(function(k){ months[k.slice(0,7)] = 1; });
  return Object.keys(months).map(function(m){ return state.userId+"_"+m; });
}
function syncLogSubs(){
  if(!DB) return;
  var need = {};
  neededDocIds().forEach(function(id){ need[id] = 1; });
  Object.keys(logSubs).forEach(function(id){
    if(!need[id]){ try{ logSubs[id](); }catch(e){} delete logSubs[id]; }
  });
  Object.keys(need).forEach(function(id){
    if(logSubs[id]) return;
    logSubs[id] = DB.doc("logs/"+id).onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      /* 快照对象是冻结的，拷贝一份再用，否则严格模式下写入会抛异常 */
      state.logs[id] = (d && d.entries) ? clone(d.entries) : {};
      persistLocal(); render();
    }, function(e){
      if(e && e.code==="revoked"){ state.readOnly = true; setNote("访问权限已变更"); }
    });
  });
}
function attachConfig(){
  ["users","boards","tasks"].forEach(function(k){
    DB.doc("config/"+k).onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      state[k] = (d && Array.isArray(d.list)) ? clone(d.list) : [];
      state.ready = true;
      normalizeSelection(); syncLogSubs(); persistLocal(); render();
    }, function(e){
      if(e && e.code==="revoked"){ state.readOnly = true; setNote("访问权限已变更"); render(); }
    });
  });
}
function boot(){
  loadTheme();
  loadPref();
  render();
  var c = window.claude;
  var p = (c && typeof c.use === "function")
    ? Promise.all([
        c.use("db").catch(function(){ return null; }),
        c.use("downloads").catch(function(){ return null; })
      ])
    : Promise.resolve([null, null]);
  p.then(function(res){
    DB = res[0]; downloadsCap = res[1];
    var eb = $("#exportBtn"); if(eb) eb.hidden = !downloadsCap;
    if(DB){ setNote("已连接 · 改动自动保存，多设备同步"); attachConfig(); }
    else {
      localMode = true; loadLocal(); normalizeSelection();
      setNote("离线模式 · 数据保存在本浏览器");
      render();
    }
  });
}
boot();
})();
</script>
